[package]
name = "dav-parse-wasm"
version = "0.1.0"
description = "WebAssembly module exposing dav-parse, s3-list-parse, storage-path, upload-sniff, secret-envelope, mcp-frame, chat-template-caps, provider-error, autotune-plan, preset-reload, load-verdict, tune-contention, prompt-framing, long-profile, s3-sign, ssrf-policy, stream-guard, gguf (gguf-meta.cjs), policy-leaves, review-verdict, tool-exchange, mcp-servers, decision, code-net-guard, role-context, completeness-report, task-lifecycle and llamacpp-autoconfig to noevia-core through a minimal, unsafe-free ABI"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Not `[lints] workspace = true`: the workspace forbids unsafe_code, and rustc counts the export
# attribute (`#[no_mangle]`) as unsafe code. This crate has no `unsafe` block; see src/lib.rs.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dav-parse = { path = "../../crates/dav-parse" }
s3-list-parse = { path = "../../crates/s3-list-parse" }
storage-path = { path = "../../crates/storage-path" }
upload-sniff = { path = "../../crates/upload-sniff" }
secret-envelope = { path = "../../crates/secret-envelope" }
mcp-frame = { path = "../../crates/mcp-frame" }
chat-template-caps = { path = "../../crates/chat-template-caps" }
provider-error = { path = "../../crates/provider-error" }
autotune-plan = { path = "../../crates/autotune-plan" }
preset-reload = { path = "../../crates/preset-reload" }
load-verdict = { path = "../../crates/load-verdict" }
tune-contention = { path = "../../crates/tune-contention" }
long-profile = { path = "../../crates/long-profile" }
prompt-framing = { path = "../../crates/prompt-framing" }
s3-sign = { path = "../../crates/s3-sign" }
ssrf-policy = { path = "../../crates/ssrf-policy" }
stream-guard = { path = "../../crates/stream-guard" }
gguf = { path = "../../crates/gguf" }
policy-leaves = { path = "../../crates/policy-leaves" }
review-verdict = { path = "../../crates/review-verdict" }
tool-exchange = { path = "../../crates/tool-exchange" }
mcp-servers = { path = "../../crates/mcp-servers" }
decision = { path = "../../crates/decision" }
code-net-guard = { path = "../../crates/code-net-guard" }
