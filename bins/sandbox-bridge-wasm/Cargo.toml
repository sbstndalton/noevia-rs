[package]
name = "sandbox-bridge-wasm"
version = "0.1.0"
description = "WebAssembly module exposing sandbox-bridge (noevia#999) to noevia-core's code sandbox through a minimal, unsafe-free ABI"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Not `[lints] workspace = true`: the workspace forbids unsafe_code, and rustc counts the export
# attribute (`#[no_mangle]`) as unsafe code. This crate has no `unsafe` block; see src/lib.rs.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sandbox-bridge = { path = "../../crates/sandbox-bridge" }
