[package]
name = "noevia-model-manager"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
[features]
default = []
native-logs = []
native-diagnose = ["native-logs", "dep:chrono"]
native-host = ["native-logs"]
native-sections = ["native-logs"]
native-prompts = ["native-logs", "dep:rusqlite", "dep:model-files"]
native-settings = ["native-logs", "dep:rusqlite"]
native-model-updates = ["native-logs", "dep:rusqlite"]
native-model-detail = ["native-model-updates", "dep:form_urlencoded"]
native-download-targets = ["native-logs"]
native-badges = ["native-prompts", "dep:form_urlencoded"]
native-bench-runs = ["native-prompts", "dep:form_urlencoded"]
native-section-writes = ["native-prompts", "dep:form_urlencoded"]
native-settings-write = ["native-settings", "native-prompts"]
native-backend-control = ["native-logs", "native-prompts"]
native-benchmark-overview = ["native-bench-runs", "native-section-writes"]
# noevia#1952: the Hub is https://huggingface.co, so the client needs TLS (rustls, webpki roots,
# certificate verification on). Downloads inherit it from here.
native-check-updates = ["native-model-updates", "native-prompts", "reqwest/rustls-tls-webpki-roots"]
native-benchmark-runner = ["native-benchmark-overview", "native-backend-control", "dep:form_urlencoded"]
# noevia#1318 slice 10: the download job table and transfers (TLS comes with check-updates).
native-downloads = ["native-check-updates"]
# noevia#1318: model deletion (snapshot shared with model detail, FastAPI dict bodies).
# noevia#1966: it refuses while a native download writes into the model's folder.
native-model-delete = ["native-model-detail", "native-prompts", "native-downloads"]
# noevia#1318 slice 12: GET /api/v1/sections/{name}/draft-heads (the model-detail snapshot and ini
# reader, the Hub client and token of the update check).
native-draft-heads = ["native-model-detail", "native-check-updates"]
[lints]
workspace = true
[dependencies]
bytes = "1"
chrono = { version = "=0.4.45", default-features = false, features = ["std"], optional = true }
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
bollard = { version = "0.20", default-features = false, features = [] }
futures-util = "0.3"
regex = "1"
serde = "1"
reqwest = { version = "0.12", default-features = false, features = ["stream"] }
serde_json = { version = "1", features = ["raw_value"] }
form_urlencoded = { version = "1", optional = true }
sha2 = "0.10"
rustix = { version = "1", features = ["fs", "process", "net"] }
gguf = { path = "../../crates/gguf" }
model-autoconfig = { path = "../../crates/model-autoconfig" }
model-files = { path = "../../crates/model-files", optional = true }
rusqlite = { version = "0.40", features = ["bundled", "hooks", "limits"], optional = true }
tempfile = "3"
server-auth = { path = "../../crates/server-auth" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "process", "signal", "io-util", "fs"] }
[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
proptest = "1"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
