[package]
name = "noevia-model-manager"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
[features]
default = []
native-logs = []
[lints]
workspace = true
[dependencies]
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
bollard = { version = "0.20", default-features = false, features = [] }
futures-util = "0.3"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["stream"] }
serde_json = "1"
server-auth = { path = "../../crates/server-auth" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "process", "signal", "io-util"] }
[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
tempfile = "3"
proptest = "1"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
