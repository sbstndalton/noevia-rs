[package]
name = "noevia-inference-gate"
version = "0.1.0"
description = "The only published entry to the chat engine router: one-chat-model admission for every client (sbstndalton/noevia#2115)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
inference-admission = { path = "../../crates/inference-admission" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
bytes = "1"
futures-util = "0.3"
getrandom = "0.2"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }

[dev-dependencies]
hyper = { version = "1", features = ["http1", "server", "client"] }
reqwest = { version = "0.12", default-features = false, features = ["stream"] }
tokio = { version = "1", features = ["io-util"] }
