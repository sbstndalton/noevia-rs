[package]
name = "noevia-laya"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
[features]
default = []
native-laya = []
[lints]
workspace = true
[dependencies]
sensitivity-service = { path = "../../crates/sensitivity-service" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
[dev-dependencies]
tempfile = "3"
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
nix = { version = "0.30", features = ["signal", "process"] }
