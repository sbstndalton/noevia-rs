[package]
name = "noevia-server"
version = "0.1.0"
description = "noevia front server (full-Rust migration M1): serves the web bundle and the routes Rust owns, proxies the rest to Node"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "noevia-server"
path = "src/main.rs"

[features]
default = []
rust-reasoning-settings = []
rust-routing-mode = []
rust-storage-reads = ["dep:server-storage-reads", "dep:zeroize"]
# M6 (#1305): GET /api/routing-default under NOEVIA_RUST_ROUTING_DEFAULT (src/routes.rs ROUTING_DEFAULT).
rust-routing-default = []
# M6 (#1650): GET /api/stats under NOEVIA_RUST_STATS (src/routes.rs STATS, crates/server-stats).
rust-stats = []
# M4's second slice: a project's chat list under NOEVIA_RUST_PROJECTS (src/routes.rs PROJECT_CHATS).
rust-project-chats = []
# M4's third slice: the free-chat list under NOEVIA_RUST_PROJECTS (src/routes.rs FREE_CHATS).
rust-free-chats = []

[dependencies]
server-storage-reads = { path = "../../crates/server-storage-reads", optional = true }
zeroize = { version = "=1.9.1", default-features = false, features = ["alloc"], optional = true }
server-routing-mode = { path = "../../crates/server-routing-mode" }
server-reasoning-settings = { path = "../../crates/server-reasoning-settings" }
server-sampling-settings = { path = "../../crates/server-sampling-settings" }
server-usage = { path = "../../crates/server-usage" }
server-routing-default = { path = "../../crates/server-routing-default" }
server-stats = { path = "../../crates/server-stats" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
base64 = "0.22"
brotli = "8"
bytes = "1"
flate2 = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "client", "server"] }
code-net-guard = { path = "../../crates/code-net-guard" }
server-auth = { path = "../../crates/server-auth" }
server-account = { path = "../../crates/server-account" }
url = "2.5"
server-store = { path = "../../crates/server-store" }
server-projects = { path = "../../crates/server-projects" }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
serde_json = "1"
tower = { version = "0.5", default-features = false, features = ["util"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal", "fs"] }

[build-dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.9"

[dev-dependencies]
tempfile = "3"
http-body-util = { version = "0.1", features = ["channel"] }
hyper = { version = "1", features = ["http1", "client", "server"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
