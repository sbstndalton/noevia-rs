[package]
name = "noevia-server"
version = "0.1.0"
description = "noevia front server (full-Rust migration M1): serves the web bundle and the routes Rust owns, proxies the rest to Node"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "noevia-server"
path = "src/main.rs"

[features]
# sbstndalton/noevia#1071: the front read routes are permanent (no deployment switch); the shipped
# build carries every one of them, and the web supervisor refuses to start without them.
default = [
    "rust-reasoning-settings",
    "rust-routing-mode",
    "rust-storage-reads",
    "rust-storage-browse",
    "rust-routing-default",
    "rust-stats",
    "rust-export",
    "rust-free-chats",
    "rust-project-chats",
    "rust-chatgpt-status",
    "rust-project-writes",
]
rust-reasoning-settings = []
rust-routing-mode = []
rust-storage-reads = ["dep:server-storage-reads", "dep:storage-path"]
# M4 (#1368): connected-storage list/read (permanent under NOEVIA_RUST_AUTH, #1071; src/storage_browse_routes.rs).
rust-storage-browse = ["rust-storage-reads"]
# M6 (#1305): GET /api/routing-default (permanent under NOEVIA_RUST_AUTH; src/routes.rs ROUTING_DEFAULT).
rust-routing-default = []
# M6 (#1650): GET /api/stats (permanent under NOEVIA_RUST_AUTH; src/routes.rs STATS, crates/server-stats).
rust-stats = []
# M4 (#1315): GET /api/export/conversations (permanent since #1071; src/routes.rs EXPORT, crates/server-export).
rust-export = []
# M6 (#1373): GET /api/providers/chatgpt (permanent under NOEVIA_RUST_AUTH; src/routes.rs CHATGPT_STATUS,
# crates/server-chatgpt-status).
rust-chatgpt-status = ["dep:server-chatgpt-status"]
# M4's second slice: a project's chat list (permanent since #1071; src/routes.rs PROJECT_CHATS).
rust-project-chats = []
# M4's third slice: the free-chat list (permanent since #1071; src/routes.rs FREE_CHATS).
rust-free-chats = []
# sbstndalton/noevia#1071: GET/POST chat context are permanent native routes.
# (src/routes.rs PROJECT_WRITES; slice 1: a free chat's attachments project).
rust-project-writes = []

[dependencies]
context-fit = { path = "../../crates/context-fit" }
engine-admission = { path = "../../crates/engine-admission" }
model-stream = { path = "../../crates/model-stream" }
research-core = { path = "../../crates/research-core" }
server-features = { path = "../../crates/server-features" }
server-diary = { path = "../../crates/server-diary" }
server-storage-reads = { path = "../../crates/server-storage-reads", optional = true }
# sbstndalton/noevia#2190 round 7: the Google Drive broker and the off-site backup (gdrive.rs,
# offsite_*.rs) are permanent and need these without the storage or ChatGPT features.
zeroize = { version = "=1.9.1", default-features = false, features = ["alloc"] }
# sbstndalton/noevia#2190: the storage test/folder routes and the Nextcloud sign-in (storage_integration_routes.rs).
s3-sign = { path = "../../crates/s3-sign" }
storage-path = { path = "../../crates/storage-path", optional = true }
rand_core = { version = "0.6", features = ["getrandom"] }
google-token-seal = { path = "../../crates/google-token-seal" }
offsite-backup-format = { path = "../../crates/offsite-backup-format" }
dav-parse = { path = "../../crates/dav-parse" }
policy-leaves = { path = "../../crates/policy-leaves" }
server-routing-mode = { path = "../../crates/server-routing-mode" }
server-reasoning-settings = { path = "../../crates/server-reasoning-settings" }
server-sampling-settings = { path = "../../crates/server-sampling-settings" }
server-usage = { path = "../../crates/server-usage" }
server-routing-default = { path = "../../crates/server-routing-default" }
server-stats = { path = "../../crates/server-stats" }
llamacpp-autoconfig = { path = "../../crates/llamacpp-autoconfig" }
preset-reload = { path = "../../crates/preset-reload" }
gguf = { path = "../../crates/gguf" }
prompt-framing = { path = "../../crates/prompt-framing" }
server-export = { path = "../../crates/server-export" }
provider-egress = { path = "../../crates/provider-egress" }
server-chatgpt-status = { path = "../../crates/server-chatgpt-status", optional = true }
# sbstndalton/noevia#2202: the MCP credential broker (mcp_broker.rs, mcp_egress.rs, mcp_routes.rs).
secret-envelope = { path = "../../crates/secret-envelope" }
ssrf-policy = { path = "../../crates/ssrf-policy" }
mcp-frame = { path = "../../crates/mcp-frame" }
# sbstndalton/noevia#2202 round 2: GET /api/toolboxes/permitted (toolbox_routes.rs).
toolboxes-permitted = { path = "../../crates/toolboxes-permitted" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
base64 = "0.22"
brotli = "8"
bytes = "1"
flate2 = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "client", "server"] }
code-net-guard = { path = "../../crates/code-net-guard" }
server-auth = { path = "../../crates/server-auth" }
server-account = { path = "../../crates/server-account" }
url = "2.5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
server-store = { path = "../../crates/server-store" }
server-projects = { path = "../../crates/server-projects" }
js-json = { path = "../../crates/js-json" }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
serde_json = "1"
tower = { version = "0.5", default-features = false, features = ["util"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal", "fs"] }

[build-dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.9"

[dev-dependencies]
# tests/storage_integrations.rs: a synthetic https Nextcloud on 127.0.0.1 (tests/fixtures/synthetic-tls).
rustls = { version = "=0.23.45", default-features = false, features = ["std", "ring", "tls12"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
tenant-assertion = { path = "../../crates/tenant-assertion" }
tempfile = "3"
http-body-util = { version = "0.1", features = ["channel"] }
hyper = { version = "1", features = ["http1", "client", "server"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
