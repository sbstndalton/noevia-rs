[package]
name = "noevia-server"
version = "0.1.0"
description = "noevia front server (full-Rust migration M1): serves the web bundle and the routes Rust owns, proxies the rest to Node"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "noevia-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
base64 = "0.22"
brotli = "8"
bytes = "1"
flate2 = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "client", "server"] }
code-net-guard = { path = "../../crates/code-net-guard" }
server-auth = { path = "../../crates/server-auth" }
url = "2.5"
server-store = { path = "../../crates/server-store" }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
serde_json = "1"
tower = { version = "0.5", default-features = false, features = ["util"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal", "fs"] }

[build-dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.9"

[dev-dependencies]
tempfile = "3"
http-body-util = { version = "0.1", features = ["channel"] }
hyper = { version = "1", features = ["http1", "client", "server"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
