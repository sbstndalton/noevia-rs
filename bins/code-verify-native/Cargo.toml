[package]
name = "code-verify-native"
version = "0.1.0"
description = "One-shot isolated server-measured Code verifier"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.30", features = ["user", "process", "signal", "resource"] }
rustix = { version = "1.1", features = ["process", "fs", "net", "time"] }

[dev-dependencies]
nix = { version = "0.30", features = ["process"] }
tempfile = "3"
