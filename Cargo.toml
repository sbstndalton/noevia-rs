[workspace]
resolver = "2"
# Every directory under crates/ and bins/ is a member (plus tools/replay). Globs, not a list: a list on one
# line made every pull request that adds a crate conflict with every other one.
members = ["crates/*", "bins/*", "tools/replay"]

[workspace.package]
edition = "2021"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

# The dav-parse WebAssembly module (noevia#967) is built with this profile by
# tools/build-dav-parse-wasm.sh; its sha256 is pinned by noevia-core.
[profile.wasm-release]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false

# noevia#1212/#1328: keep code-actions and its JSON reader optimized for semantic/adversarial
# debug coverage. Wall-clock budgets are qualified separately in the mandatory single-worker
# release-profile CI phase; this mixed debug profile is not a deployed-build timing guarantee.
[profile.dev.package.code-actions]
opt-level = 3

[profile.dev.package.prompt-framing]
opt-level = 3

# browser-policy's timed tests (inputs at the 4 MiB cap, refusals under 10 ms) mean what the wasm
# module does only when optimised.
[profile.dev.package.browser-policy]
opt-level = 3

# tool-gate's timed tests (messages at the 4 MiB cap) mean what the wasm module does only when
# optimised.
[profile.dev.package.tool-gate]
opt-level = 3

# server-auth's differential test verifies ~100 Node Argon2id hashes (19 MiB, t=2); unoptimised
# that alone takes minutes.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
