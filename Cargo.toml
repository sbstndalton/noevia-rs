[workspace]
resolver = "2"
members = ["bins/noevia-ocr", "crates/gguf", "crates/gguf-memtest", "crates/egress", "bins/gguf-meta", "bins/egress-proxy", "crates/model-files", "bins/model-files", "crates/dav-parse", "crates/s3-list-parse", "crates/storage-path", "crates/upload-sniff", "crates/secret-envelope", "crates/mcp-frame", "bins/dav-parse-wasm", "crates/docx-text", "bins/docx-text", "crates/sandbox-bridge", "bins/sandbox-bridge-wasm", "crates/provider-error", "crates/chat-template-caps", "crates/autotune-plan", "crates/preset-reload", "crates/load-verdict", "crates/tune-contention", "crates/prompt-framing", "crates/long-profile", "crates/s3-sign", "crates/ssrf-policy", "crates/stream-guard", "crates/policy-leaves", "crates/review-verdict", "crates/tool-exchange", "crates/mcp-servers", "crates/decision", "crates/code-net-guard", "crates/role-context", "crates/completeness-report", "crates/task-lifecycle", "crates/llamacpp-autoconfig", "crates/model-autoconfig", "bins/model-autoconfig", "crates/tenant-assertion", "bins/tenant-assertion", "crates/code-actions", "crates/project-file-names", "crates/provider-egress", "crates/browser-policy", "crates/tool-gate", "crates/toolboxes-permitted", "crates/llamacpp-presets", "crates/project-edit-target", "tools/replay", "bins/noevia-server", "crates/server-store", "crates/server-auth", "crates/js-json", "crates/passkey", "crates/server-account", "crates/server-projects"]

[workspace.package]
edition = "2021"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

# The dav-parse WebAssembly module (noevia#967) is built with this profile by
# tools/build-dav-parse-wasm.sh; its sha256 is pinned by noevia-core.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false

# noevia#1212: code-actions' timed tests (deep `find -exec` chains, reading-work refusals) bound
# wall-clock time; build that crate and the JSON reader it uses optimised under `cargo test` so the
# bounds mean what the wasm module does.
[profile.dev.package.code-actions]
opt-level = 3

[profile.dev.package.prompt-framing]
opt-level = 3

# browser-policy's timed tests (inputs at the 4 MiB cap, refusals under 10 ms) mean what the wasm
# module does only when optimised.
[profile.dev.package.browser-policy]
opt-level = 3

# tool-gate's timed tests (messages at the 4 MiB cap) mean what the wasm module does only when
# optimised.
[profile.dev.package.tool-gate]
opt-level = 3

# server-auth's differential test verifies ~100 Node Argon2id hashes (19 MiB, t=2); unoptimised
# that alone takes minutes.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
