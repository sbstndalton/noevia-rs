[workspace]
resolver = "2"
members = ["crates/gguf", "crates/gguf-memtest", "bins/gguf-meta"]

[workspace.package]
edition = "2021"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
