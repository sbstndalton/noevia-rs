[workspace]
resolver = "2"
members = ["crates/gguf", "crates/gguf-memtest", "crates/egress", "bins/gguf-meta", "bins/egress-proxy", "crates/model-files", "bins/model-files", "crates/dav-parse", "crates/s3-list-parse", "crates/storage-path", "crates/upload-sniff", "crates/secret-envelope", "crates/mcp-frame", "bins/dav-parse-wasm", "crates/docx-text", "bins/docx-text", "crates/sandbox-bridge", "bins/sandbox-bridge-wasm", "crates/provider-error", "crates/chat-template-caps", "crates/autotune-plan", "crates/preset-reload", "crates/load-verdict", "crates/tune-contention"]

[workspace.package]
edition = "2021"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

# The dav-parse WebAssembly module (noevia#967) is built with this profile by
# tools/build-dav-parse-wasm.sh; its sha256 is pinned by noevia-core.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
