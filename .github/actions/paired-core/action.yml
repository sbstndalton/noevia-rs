name: Paired front core
description: >-
  Checks out contracts/http/front-core.ref, the Core generation paired with this front, at
  front-core; installs its server dependencies and builds its pinned dav-parse.wasm. Front replays
  run behind it (the release guard refuses mixed feature owners, and the front serves the feature
  routes only once that Core's feature runtime has registered). core.ref stays the recording
  oracle for Node-direct references and negative controls. Needs Node 22 and the wasm32 target.
runs:
  using: composite
  steps:
    - name: Read the paired front core ref
      id: ref
      shell: bash
      run: |
        set -euo pipefail
        ref=$(tr -d ' \n' < contracts/http/front-core.ref)
        [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::contracts/http/front-core.ref is not a 40-char SHA"; exit 1; }
        echo "sha=$ref" >> "$GITHUB_OUTPUT"
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        repository: sbstndalton/noevia-core
        ref: ${{ steps.ref.outputs.sha }}
        path: front-core
    - shell: bash
      working-directory: front-core/server
      run: npm ci --no-fund --no-audit
    - name: Build dav-parse.wasm at the paired core's pinned noevia-rs ref
      shell: bash
      working-directory: front-core
      run: |
        set -euo pipefail
        eval "$(grep -E '^(NOEVIA_RS_REF|NOEVIA_RS_SHA256|DAV_PARSE_WASM_SHA256)=[0-9a-f]+$' server/dav-parse.lock)"
        [[ "$NOEVIA_RS_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::paired core dav-parse.lock NOEVIA_RS_REF is not a 40-char SHA"; exit 1; }
        curl -fsSL "https://codeload.github.com/sbstndalton/noevia-rs/tar.gz/$NOEVIA_RS_REF" -o "$RUNNER_TEMP/front-rs.tgz"
        echo "$NOEVIA_RS_SHA256  $RUNNER_TEMP/front-rs.tgz" | sha256sum -c -
        mkdir -p "$RUNNER_TEMP/front-rs-pin" && tar -xzf "$RUNNER_TEMP/front-rs.tgz" --strip-components=1 -C "$RUNNER_TEMP/front-rs-pin"
        "$RUNNER_TEMP/front-rs-pin/tools/build-dav-parse-wasm.sh" "$PWD/server/wasm/dav-parse.wasm"
        echo "$DAV_PARSE_WASM_SHA256  server/wasm/dav-parse.wasm" | sha256sum -c -
