name: Native engine statistics GET
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  stats-native:
    name: Required native engine statistics contracts (#1650)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Read actual merged core pin
        id: core
        run: |
          set -euo pipefail
          ref=$(tr -d ' \n' < contracts/http/core.ref)
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: sbstndalton/noevia-core
          ref: ${{ steps.core.outputs.sha }}
          path: core
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - uses: dtolnay/rust-toolchain@70dec6087f2cb6bab9fbac4da23160afbe848e91
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked -p server-stats -p noevia-server --all-targets --features noevia-server/rust-stats -- -D warnings
      - name: Actual core handler oracle reproduces the committed corpus
        run: |
          set -euo pipefail
          node crates/server-stats/tests/oracle.cjs "$PWD/core" "$RUNNER_TEMP/node-stats.json"
          cmp "$RUNNER_TEMP/node-stats.json" crates/server-stats/tests/fixtures/node-stats.v1.json
      - name: Node-differential replay, engine limits, shared-read and JS-semantics properties
        run: NOEVIA_STATS_FIXTURE="$RUNNER_TEMP/node-stats.json" cargo test --locked -p server-stats
      - name: Real HTTP identity, shared read, write invalidation and switch through the front
        run: cargo test --locked -p noevia-server --features rust-stats
      - name: Compiled capability and isolated featureless startup refusal
        run: |
          set -euo pipefail
          cargo build --locked --target-dir target/stats-featureless -p noevia-server --no-default-features
          if target/stats-featureless/debug/noevia-server --features | grep -qx rust-stats; then exit 1; fi
          if NOEVIA_LEGACY_UPSTREAM=http://127.0.0.1:9 target/stats-featureless/debug/noevia-server > "$RUNNER_TEMP/stats-featureless.log" 2>&1; then exit 1; fi
          grep -q 'needs compiled rust-stats' "$RUNNER_TEMP/stats-featureless.log"
          cargo build --locked -p replay -p noevia-server --features noevia-server/rust-stats
          target/debug/noevia-server --features | grep -qx rust-stats
          # The Lemonade kind is refused rather than answered without Node's last-response MTP samples.
          if NOEVIA_LEGACY_UPSTREAM=http://127.0.0.1:9 LEMONADE_BASE_URL=http://127.0.0.1:9 target/debug/noevia-server > "$RUNNER_TEMP/stats-lemonade.log" 2>&1; then exit 1; fi
          grep -q 'not available with the Lemonade model manager' "$RUNNER_TEMP/stats-lemonade.log"
      - run: npm ci --no-fund --no-audit
        working-directory: core/server
      - name: Build dav-parse.wasm at core's pinned noevia-rs ref
        working-directory: core
        run: |
          set -euo pipefail
          eval "$(grep -E '^(NOEVIA_RS_REF|NOEVIA_RS_SHA256|DAV_PARSE_WASM_SHA256)=[0-9a-f]+$' server/dav-parse.lock)"
          [[ "$NOEVIA_RS_REF" =~ ^[0-9a-f]{40}$ ]]
          curl -fsSL "https://codeload.github.com/sbstndalton/noevia-rs/tar.gz/$NOEVIA_RS_REF" -o "$RUNNER_TEMP/rs.tgz"
          echo "$NOEVIA_RS_SHA256  $RUNNER_TEMP/rs.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/rs-pin" && tar -xzf "$RUNNER_TEMP/rs.tgz" --strip-components=1 -C "$RUNNER_TEMP/rs-pin"
          "$RUNNER_TEMP/rs-pin/tools/build-dav-parse-wasm.sh" "$PWD/server/wasm/dav-parse.wasm"
          echo "$DAV_PARSE_WASM_SHA256  server/wasm/dav-parse.wasm" | sha256sum -c -
      - name: Replay against Node directly (reference data dir)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/seed"
          target/debug/replay run --corpus contracts/http/corpus --base http://127.0.0.1:18021 \
            --ignore-body hours --ignore-body peakHour/hour \
            --seed "$RUNNER_TEMP/seed" --work "$RUNNER_TEMP/work-node" \
            --server-cmd "exec '$GITHUB_WORKSPACE/target/debug/corpus-launcher' serve '$GITHUB_WORKSPACE/core'" \
            --state-out "$RUNNER_TEMP/node-state.json"
      - name: Full replay through the front with NOEVIA_RUST_AUTH=1
        run: |
          set -euo pipefail
          target/debug/replay run --corpus contracts/http/corpus --base http://127.0.0.1:18021 \
            --ignore-body hours --ignore-body peakHour/hour \
            --seed "$RUNNER_TEMP/seed" --work "$RUNNER_TEMP/work-stats" \
            --native-move-state --server-cmd "exec env NOEVIA_RUST_AUTH=1 sh '$GITHUB_WORKSPACE/tools/front/replay-front.sh' '$GITHUB_WORKSPACE/core' '$GITHUB_WORKSPACE/target/debug/noevia-server'" \
            --report "$RUNNER_TEMP/stats-positive.json" --state-ignore '*projects.json.lock' --state-ignore '*free-chats.json.lock' --state-ignore '*chat-transcripts.lock' --state-ignore '*chat-changes.jsonl' --expect-state "$RUNNER_TEMP/node-state.json"
      - name: "Native proof: the front reads its own synthetic engine, so only /api/stats differs"
        # The corpus engine is the `none` kind (up false). Pointed at a synthetic llama.cpp router
        # (Node keeps its own clean corpus environment), the front's /api/stats answers change and
        # nothing else does: the clean replay above was the front's own answer, not a proxied one.
        run: |
          set -uo pipefail
          python3 - "$RUNNER_TEMP/engine.port" <<'PY' &
          import http.server, sys
          LISTING = b'{"data":[{"id":"synthetic","status":{"value":"loaded"}}]}'
          METRICS = b'llamacpp:prompt_tokens_total 7\n'
          class H(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  body = LISTING if self.path == '/models' else METRICS if self.path.startswith('/metrics?model=synthetic') else b''
                  self.send_response(200 if body else 404)
                  self.send_header('Content-Length', str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
              def log_message(self, *a):
                  pass
          s = http.server.ThreadingHTTPServer(('127.0.0.1', 0), H)
          open(sys.argv[1], 'w').write(str(s.server_address[1]))
          s.serve_forever()
          PY
          for _ in $(seq 50); do [ -s "$RUNNER_TEMP/engine.port" ] && break; sleep 0.1; done
          port=$(cat "$RUNNER_TEMP/engine.port")
          if target/debug/replay run --corpus contracts/http/corpus --base http://127.0.0.1:18021 \
              --ignore-body hours --ignore-body peakHour/hour \
              --seed "$RUNNER_TEMP/seed" --work "$RUNNER_TEMP/work-proof" \
              --native-move-state --server-cmd "exec env NOEVIA_RUST_AUTH=1 MODEL_MANAGER_KIND=llamacpp MODEL_MANAGER_BASE_URL=http://127.0.0.1:$port/v1 sh '$GITHUB_WORKSPACE/tools/front/replay-front.sh' '$GITHUB_WORKSPACE/core' '$GITHUB_WORKSPACE/target/debug/noevia-server'" \
              --report "$RUNNER_TEMP/stats-proof.json"; then
            echo "::error::the front's /api/stats did not follow its own engine"; exit 1
          fi
          python3 - "$RUNNER_TEMP/stats-proof.json" <<'PY'
          import json, sys
          rows = json.load(open(sys.argv[1]))
          bad = [r for r in rows if r['diffs'] or r['error'] or r['status'] != r['expectedStatus']]
          stats = [r for r in bad if r['method'] == 'GET' and r['path'] == '/api/stats']
          assert stats and len(stats) == len(bad), [(r['method'], r['path'], r['diffs']) for r in bad]
          assert all(r['status'] == 200 and any(d['at'].endswith('up') for d in r['diffs']) for r in stats), stats
          print('only GET /api/stats differs, natively:', len(stats))
          PY
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-stats-evidence
          path: |
            ${{ runner.temp }}/node-stats.json
            ${{ runner.temp }}/stats-positive.json
            ${{ runner.temp }}/stats-proof.json
            ${{ runner.temp }}/node-state.json
          if-no-files-found: ignore
