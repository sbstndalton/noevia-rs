  native-diagnose:
    name: Native diagnosis closed transport, actual oracles and ownership
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: sbstndalton/noevia-services
          ref: d890ab476d1f1a8b6de799d6428e45b6af42a473
          path: diagnose-services
      - name: Read unchanged actual core pin
        id: diagnose-core
        run: |
          set -euo pipefail
          ref=$(tr -d ' \n' < contracts/http/core.ref)
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: sbstndalton/noevia-core
          ref: ${{ steps.diagnose-core.outputs.sha }}
          path: diagnose-core
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@70dec6087f2cb6bab9fbac4da23160afbe848e91
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Prepare immutable oracle and external locked Node dependencies
        run: |
          set -euo pipefail
          python3 -m pip install docker==7.1.0 requests==2.34.2 fastapi==0.115.6 httpx==0.28.1 pydantic==2.14.0 pydantic-core==2.50.0 starlette==0.41.3 uvicorn==0.34.0
          echo "PYTHON=$(command -v python3)" >> "$GITHUB_ENV"
          umask 077
          dependency_root="$RUNNER_TEMP/diagnose-node-dependencies"
          mkdir -m 700 "$dependency_root"
          git -C diagnose-core show '${{ steps.diagnose-core.outputs.sha }}:server/package.json' > "$dependency_root/package.json"
          git -C diagnose-core show '${{ steps.diagnose-core.outputs.sha }}:server/package-lock.json' > "$dependency_root/package-lock.json"
          npm ci --prefix "$dependency_root" --no-fund --no-audit
      - name: Build unchanged actual-core WASM prerequisite
        run: |
          set -euo pipefail
          eval "$(grep -E '^(NOEVIA_RS_REF|NOEVIA_RS_SHA256|DAV_PARSE_WASM_SHA256)=[0-9a-f]+$' diagnose-core/server/dav-parse.lock)"
          [[ "$NOEVIA_RS_REF" =~ ^[0-9a-f]{40}$ ]]
          curl -fsSL "https://codeload.github.com/sbstndalton/noevia-rs/tar.gz/$NOEVIA_RS_REF" -o "$RUNNER_TEMP/diagnose-wasm.tgz"
          echo "$NOEVIA_RS_SHA256  $RUNNER_TEMP/diagnose-wasm.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/diagnose-wasm"
          tar -xzf "$RUNNER_TEMP/diagnose-wasm.tgz" --strip-components=1 -C "$RUNNER_TEMP/diagnose-wasm"
          "$RUNNER_TEMP/diagnose-wasm/tools/build-dav-parse-wasm.sh" "$GITHUB_WORKSPACE/diagnose-core/server/wasm/dav-parse.wasm"
          echo "$DAV_PARSE_WASM_SHA256  diagnose-core/server/wasm/dav-parse.wasm" | sha256sum -c -
      - name: Fresh immutable SDK wire and selected FastAPI AST gates
        env:
          NOEVIA_DIAGNOSE_SERVICES_SOURCE: ${{ github.workspace }}/diagnose-services
          NOEVIA_DIAGNOSE_DOCKER_SDK: ${{ env.pythonLocation }}/lib/python3.12/site-packages/docker
        run: |
          cargo run --locked -q -p noevia-model-manager --bin generate-diagnose-transport-oracle > "$RUNNER_TEMP/diagnose-sdk.json"
          cargo run --locked -q -p noevia-model-manager --bin generate-diagnose-transport-oracle -- --routes > "$RUNNER_TEMP/diagnose-routes.json"
      - name: Committed Python diagnosis oracles are exactly what the generators produce
        env:
          NOEVIA_DIAGNOSE_SERVICES_SOURCE: ${{ github.workspace }}/diagnose-services
        run: |
          set -euo pipefail
          cargo run --locked -q -p noevia-model-manager --bin generate-diagnose-oracle > "$RUNNER_TEMP/diagnose-pure.json"
          # Only the interpreter's own patch/build string may differ from the committed bytes.
          python3 - "$RUNNER_TEMP/diagnose-pure.json" bins/noevia-model-manager/tests/fixtures/diagnose-python.v1.json "$RUNNER_TEMP/diagnose-routes.json" bins/noevia-model-manager/tests/fixtures/diagnose-transport-python.v1.json <<'PYCMP'
          import json, sys
          for fresh, committed in [(sys.argv[1], sys.argv[2]), (sys.argv[3], sys.argv[4])]:
              a = json.load(open(fresh)); b = json.load(open(committed))
              assert a.get("python", "").startswith("3.12.") and b.get("python", "").startswith("3.12."), committed
              a.pop("python"); b.pop("python")
              assert a == b, committed + " is not what its generator produces"
              print("current:", committed)
          PYCMP
      - name: New closed native transport, route and retained ownership controls
        env:
          NOEVIA_DIAGNOSE_SDK_ORACLE: ${{ runner.temp }}/diagnose-sdk.json
          NOEVIA_DIAGNOSE_ROUTE_ORACLE: ${{ runner.temp }}/diagnose-routes.json
        run: |
          cargo clippy --locked -p noevia-model-manager --features native-diagnose --lib --bin noevia-model-manager --bin generate-diagnose-transport-oracle --test diagnose_transport --test diagnose_route --test diagnose_lifecycle -- -D warnings
          cargo test --locked -p noevia-model-manager --features native-diagnose --test diagnose_transport --test diagnose_route --test diagnose_lifecycle
      - name: Actual connected Linux Unix reset witness and retained driver join
        run: |
          set -euo pipefail
          umask 077
          evidence="$RUNNER_TEMP/diagnose-unix-reset"
          mkdir -m 700 "$evidence"
          git rev-parse HEAD 'HEAD^{tree}' > "$evidence/source.identity"
          sha256sum bins/noevia-model-manager/src/diagnose_docker.rs > "$evidence/source.sha256"
          uname -srm > "$evidence/runtime.txt"
          set +e
          cargo clippy --locked -p noevia-model-manager --features native-diagnose --lib --profile test --message-format=json -- -D warnings > "$evidence/clippy.stdout" 2> "$evidence/clippy.stderr"
          result=$?
          printf '%s\n' "$result" > "$evidence/clippy.status"
          set -e
          test "$result" -eq 0
          set +e
          cargo test --locked -p noevia-model-manager --features native-diagnose --lib --no-run --message-format=json > "$evidence/build.stdout" 2> "$evidence/build.stderr"
          result=$?
          printf '%s\n' "$result" > "$evidence/build.status"
          set -e
          test "$result" -eq 0
          binary=$(jq -ser '[.[] | select(.reason == "compiler-artifact" and .target.name == "noevia_model_manager" and .profile.test == true and .executable != null) | .executable] | if length == 1 then .[0] else error("unique owned lib test executable required") end' "$evidence/build.stdout")
          binary=$(realpath -e "$binary")
          case "$binary" in "$GITHUB_WORKSPACE"/target/debug/deps/noevia_model_manager-*) ;; *) exit 1 ;; esac
          leaf=${binary##*/}
          [[ "$leaf" =~ ^noevia_model_manager-[0-9a-f]{16}$ ]]
          test -f "$binary" && test -x "$binary"
          sha256sum -c "$evidence/source.sha256"
          sha256sum "$binary" > "$evidence/binary.sha256"
          printf '%s\n' "$binary" '--exact' 'diagnose_docker::transport_error_tests::connected_unix_unread_request_reset_is_ordinary_after_actual_driver_join' '--nocapture' > "$evidence/command.txt"
          set +e
          "$binary" --exact diagnose_docker::transport_error_tests::connected_unix_unread_request_reset_is_ordinary_after_actual_driver_join --nocapture > "$evidence/control.stdout" 2> "$evidence/control.stderr"
          result=$?
          printf '%s\n' "$result" > "$evidence/control.status"
          set -e
          test "$result" -eq 0
          grep -Fx 'test diagnose_docker::transport_error_tests::connected_unix_unread_request_reset_is_ordinary_after_actual_driver_join ... ok' "$evidence/control.stdout"
          grep -E '^test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out; finished in .+$' "$evidence/control.stdout"
      - name: Whole actual public front and explicit default-off controls
        env:
          NOEVIA_DIAGNOSE_CORE_SOURCE: ${{ github.workspace }}/diagnose-core
          NOEVIA_DIAGNOSE_SERVICES_SOURCE: ${{ github.workspace }}/diagnose-services
          NOEVIA_DIAGNOSE_DEPENDENCIES: ${{ runner.temp }}/diagnose-node-dependencies
        run: |
          cargo build --locked -p noevia-model-manager --bin noevia-model-manager --no-default-features
          cp target/debug/noevia-model-manager /tmp/s1-diagnose-featureless-manager
          cargo build --locked -p replay --bin diagnose-contracts --bin corpus-launcher
          target/debug/diagnose-contracts --featureless
          cargo build --locked -p noevia-model-manager --bin noevia-model-manager --features native-diagnose
          cargo build --locked -p noevia-server --bin noevia-server
          cargo clippy --locked -p replay --bin diagnose-contracts -- -D warnings
          cargo test --locked -p replay --bin diagnose-contracts
          cargo test --locked -p noevia-model-manager --features native-diagnose --bin noevia-model-manager diagnosis_command_tests::native_child_confirmation_semantics -- --exact
          target/debug/corpus-launcher verify "$PWD/diagnose-core"
          target/debug/diagnose-contracts --startup
          target/debug/diagnose-contracts --controls
          target/debug/diagnose-contracts --security
          target/debug/diagnose-contracts
      - name: Five new source-bound production diagnosis mutations
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          NOEVIA_DIAGNOSE_MUTATION_EVIDENCE: ${{ runner.temp }}/diagnose-wave-b-mutations
          NOEVIA_DIAGNOSE_CORE_SOURCE: ${{ github.workspace }}/diagnose-core
          NOEVIA_DIAGNOSE_SERVICES_SOURCE: ${{ github.workspace }}/diagnose-services
          NOEVIA_DIAGNOSE_DEPENDENCIES: ${{ runner.temp }}/diagnose-node-dependencies
        run: |
          cargo clippy --locked -p noevia-model-manager --bin check-diagnose-wave-b-mutations -- -D warnings
          cargo test --locked -p noevia-model-manager --bin check-diagnose-wave-b-mutations
          cargo build --locked -p noevia-model-manager --bin check-diagnose-wave-b-mutations
          target/debug/check-diagnose-wave-b-mutations --execute
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-diagnose-closed-qualification
          path: |
            ${{ runner.temp }}/diagnose-sdk.json
            ${{ runner.temp }}/diagnose-routes.json
            ${{ runner.temp }}/diagnose-unix-reset
            /tmp/s1-diagnose-public-current.json
            /tmp/s1-diagnose-public-security.json
            /tmp/s1-diagnose-public-control-*.json
            /tmp/s1-diagnose-startup-*.json
            /tmp/s1-diagnose-featureless-control.json
            ${{ runner.temp }}/diagnose-wave-b-mutations

  native-ocr:
    name: Native OCR matches the pinned Python sidecar (real engines)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: sbstndalton/noevia-services
          ref: bbed9b8a5af9f66ea3133fd8ee5495013d11d6c7
          path: legacy-services
      - uses: dtolnay/rust-toolchain@70dec6087f2cb6bab9fbac4da23160afbe848e91 # 1.99.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install the real OCR/PDF engines
        run: sudo apt-get update && sudo apt-get install -y poppler-utils ghostscript tesseract-ocr tesseract-ocr-eng tesseract-ocr-deu
      - run: cargo clippy --locked -p noevia-ocr --all-targets --features native-ocr -- -D warnings
      - name: HTTP differential, scanned-only negative control and oversized PDF reduction
        env:
          NOEVIA_OCR_REFERENCE: ${{ github.workspace }}/legacy-services/ocr
          NOEVIA_OCR_REAL_ENGINES: '1'
        run: cargo test --locked -p noevia-ocr --features native-ocr -- --nocapture
      - name: Featureless startup and advertised capability fail closed
        run: |
          cargo build --locked -p noevia-ocr --no-default-features
          if target/debug/noevia-ocr --features; then echo '::error::featureless binary claimed native OCR'; exit 1; fi
          if target/debug/noevia-ocr; then echo '::error::featureless binary started'; exit 1; fi
          cargo build --locked -p noevia-ocr --features native-ocr
          test "$(target/debug/noevia-ocr --features)" = native-ocr

  reasoning-native:
    name: Required native reasoning default contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Read actual merged core pin
        id: core
        run: |
          set -euo pipefail
          ref=$(tr -d ' \n' < contracts/http/core.ref)
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: sbstndalton/noevia-core
          ref: ${{ steps.core.outputs.sha }}
          path: core
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm ci --no-fund --no-audit
        working-directory: core/server
      - uses: dtolnay/rust-toolchain@70dec6087f2cb6bab9fbac4da23160afbe848e91
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Build the independently checksum-pinned actual-core WASM
        run: |
          set -euo pipefail
          eval "$(grep -E '^(NOEVIA_RS_REF|NOEVIA_RS_SHA256|DAV_PARSE_WASM_SHA256)=[0-9a-f]+$' core/server/dav-parse.lock)"
          [[ "$NOEVIA_RS_REF" =~ ^[0-9a-f]{40}$ ]]
          curl -fsSL "https://codeload.github.com/sbstndalton/noevia-rs/tar.gz/$NOEVIA_RS_REF" -o "$RUNNER_TEMP/reasoning-wasm.tgz"
          echo "$NOEVIA_RS_SHA256  $RUNNER_TEMP/reasoning-wasm.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/reasoning-wasm"
          tar -xzf "$RUNNER_TEMP/reasoning-wasm.tgz" --strip-components=1 -C "$RUNNER_TEMP/reasoning-wasm"
          "$RUNNER_TEMP/reasoning-wasm/tools/build-dav-parse-wasm.sh" "$GITHUB_WORKSPACE/core/server/wasm/dav-parse.wasm"
          echo "$DAV_PARSE_WASM_SHA256  core/server/wasm/dav-parse.wasm" | sha256sum -c -
      - name: Checked-in corpus retains strict request-anchored calendar checks
        run: cargo test --locked -p replay calendar
      - name: Regenerate actual Node SQLite oracle and require its full contract
        run: |
          set -euo pipefail
          node crates/server-reasoning-settings/tests/oracle.cjs "$PWD/core" "$RUNNER_TEMP/node-reasoning.json"
          python3 - "$RUNNER_TEMP/node-reasoning.json" <<'PYORACLE'
          import json,sys
          a=json.load(open(sys.argv[1]));b=json.load(open('crates/server-reasoning-settings/tests/fixtures/node-reasoning.v1.json'))
          a.pop('node');b.pop('node')
          assert a==b,'actual merged core oracle changed'
          assert len(a['cases'])==52
          PYORACLE
          NOEVIA_REASONING_FIXTURE="$RUNNER_TEMP/node-reasoning.json" NOEVIA_REASONING_CORE_SHA="$(cat contracts/http/core.ref)" cargo test --locked -p server-reasoning-settings
      - run: cargo clippy --locked -p server-reasoning-settings -p noevia-server --all-targets --features rust-reasoning-settings -- -D warnings
      - run: cargo test --locked -p noevia-server --features rust-reasoning-settings
      - name: Compiled capability and isolated featureless startup refusal
        run: |
          set -euo pipefail
          cargo build --locked --target-dir target/reasoning-featureless -p noevia-server --no-default-features
          if target/reasoning-featureless/debug/noevia-server --features | grep -qx rust-reasoning-settings; then exit 1; fi
          if NOEVIA_LEGACY_UPSTREAM=http://127.0.0.1:9 target/reasoning-featureless/debug/noevia-server > omission.log 2>&1; then exit 1; fi
          grep -q 'needs compiled rust-reasoning-settings' omission.log
          cargo build --locked -p replay -p noevia-server --features rust-reasoning-settings
          target/debug/noevia-server --features | grep -qx rust-reasoning-settings
      - name: Actual spawn and actual budget factory synthetic input seam
        run: |
          target/debug/corpus-launcher verify "$PWD/core"
          target/debug/corpus-launcher verify-omission "$PWD/core"
          target/debug/host-control "$PWD/core" "$PWD/contracts/http/corpus" "$RUNNER_TEMP/wrong-host"
      - name: Full actual merged-core replay and equal state
        run: sh tools/front/reasoning-contracts.sh "$PWD/core" "$PWD/target/debug/noevia-server" "$PWD/target/debug/replay" "$RUNNER_TEMP/reasoning-front"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-reasoning-contracts
          path: |
            ${{ runner.temp }}/reasoning-front/*json
            ${{ runner.temp }}/node-reasoning.json
            omission.log
          if-no-files-found: error
