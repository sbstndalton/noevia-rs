name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@70dec6087f2cb6bab9fbac4da23160afbe848e91 # 1.99.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check if the workspace has any packages
        id: pkgs
        run: |
          if ls crates/*/Cargo.toml bins/*/Cargo.toml >/dev/null 2>&1; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
          fi
      - name: cargo fmt --check
        if: steps.pkgs.outputs.any == 'true'
        run: cargo fmt --all --check
      - name: cargo clippy
        if: steps.pkgs.outputs.any == 'true'
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: cargo test
        if: steps.pkgs.outputs.any == 'true'
        run: cargo test --locked --workspace
