name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust fmt, clippy, test
    runs-on: ubuntu-latest
    env:
      NOEVIA_DOCLING_REFERENCE: ${{ github.workspace }}/.ci-docling/docling
      NOEVIA_LAYA_REFERENCE: ${{ github.workspace }}/.ci-laya/laya
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@70dec6087f2cb6bab9fbac4da23160afbe848e91 # 1.99.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Verify merged Docling worker oracle (#1322)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/docling-services.tgz https://codeload.github.com/sbstndalton/noevia-services/tar.gz/bbed9b8a5af9f66ea3133fd8ee5495013d11d6c7
          echo 'd35a0351a98514411a0e87f112d041e53096b1cda6d3e3b409a4765f9601d9bb  /tmp/docling-services.tgz' | sha256sum -c -
          mkdir .ci-docling
          tar -xzf /tmp/docling-services.tgz -C .ci-docling --strip-components=1
      - name: Verify merged Laya worker oracle (#1326)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/laya-services.tgz https://codeload.github.com/sbstndalton/noevia-services/tar.gz/920d57d82d8f4c817760255cff602e15ccc64448
          echo '540e14cf3e495e74387cb6f39b12395615b31e8737bf304e757a0d3ab8976ffd  /tmp/laya-services.tgz' | sha256sum -c -
          mkdir .ci-laya
          tar -xzf /tmp/laya-services.tgz -C .ci-laya --strip-components=1
      - name: Check if the workspace has any packages
        id: pkgs
        run: |
          if ls crates/*/Cargo.toml bins/*/Cargo.toml >/dev/null 2>&1; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
          fi
      - name: cargo fmt --check
        if: steps.pkgs.outputs.any == 'true'
        run: cargo fmt --all --check
      - name: cargo clippy
        if: steps.pkgs.outputs.any == 'true'
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: cargo test
        if: steps.pkgs.outputs.any == 'true'
        run: cargo test --locked --workspace
      - name: Optimized code-actions performance qualification (#1328)
        run: cargo test --locked --release -p code-actions --test deep_find --test properties -- --test-threads=1

  laya-native:
    name: Native Laya HTTP and retained worker lifecycle
    runs-on: ubuntu-latest
    env:
      NOEVIA_LAYA_REFERENCE: ${{ github.workspace }}/.ci-laya/laya
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@70dec6087f2cb6bab9fbac4da23160afbe848e91 # 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Verify actual merged worker and production interpreter
        run: |
          set -euo pipefail
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 12)'
          curl -fsSL -o /tmp/laya-services.tgz https://codeload.github.com/sbstndalton/noevia-services/tar.gz/920d57d82d8f4c817760255cff602e15ccc64448
          echo '540e14cf3e495e74387cb6f39b12395615b31e8737bf304e757a0d3ab8976ffd  /tmp/laya-services.tgz' | sha256sum -c -
          mkdir .ci-laya
          tar -xzf /tmp/laya-services.tgz -C .ci-laya --strip-components=1
      - name: Actual Python HTTP oracle is reproducible
        run: |
          cargo run --locked -p laya-service --example gen-fixtures -- "$NOEVIA_LAYA_REFERENCE" /tmp/laya-http.json
          cmp /tmp/laya-http.json crates/laya-service/tests/fixtures/python-http.v1.json
      - name: Native HTTP, frames, pool lifecycle and actual synthetic engine
        run: cargo test --locked -p laya-service
      - name: Real feature omission refusal before listener or child
        run: cargo test --locked -p noevia-laya --test capability
      - name: Compiled native capability and no fallback on engine failure
        run: cargo test --locked -p noevia-laya --features native-laya --test capability

  docling-native:
    name: Native Docling HTTP and real worker transport
    runs-on: ubuntu-latest
    env:
      NOEVIA_DOCLING_REFERENCE: ${{ github.workspace }}/.ci-docling/docling
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@70dec6087f2cb6bab9fbac4da23160afbe848e91 # 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Verify actual merged worker and production interpreter
        run: |
          set -euo pipefail
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 12)'
          curl -fsSL -o /tmp/docling-services.tgz https://codeload.github.com/sbstndalton/noevia-services/tar.gz/bbed9b8a5af9f66ea3133fd8ee5495013d11d6c7
          echo 'd35a0351a98514411a0e87f112d041e53096b1cda6d3e3b409a4765f9601d9bb  /tmp/docling-services.tgz' | sha256sum -c -
          mkdir .ci-docling
          tar -xzf /tmp/docling-services.tgz -C .ci-docling --strip-components=1
      - name: Actual Python oracle is reproducible
        run: |
          cargo run --locked -p docling-service --example gen-fixtures -- "$NOEVIA_DOCLING_REFERENCE" /tmp/docling-http.json
          cmp /tmp/docling-http.json crates/docling-service/tests/fixtures/python-http.v1.json
      - name: Native HTTP, frames, cancellation and actual fake-engine worker
        run: cargo test --locked -p docling-service
      - name: Actual binary refuses omitted compiled capability before spawn
        run: cargo test --locked -p noevia-docling --test capability
      - name: Actual feature-enabled binary serves and reaps its warm child
        run: cargo test --locked -p noevia-docling --features native-docling --test capability

  routes-check:
    # Full-Rust migration M0: every /api/ path the web client names (noevia-web src/ at the ref in
    # contracts/http/web.ref) must be listed in contracts/http/routes.toml with an owner. Bump
    # web.ref (and add the new paths) when the client grows a route. A second, advisory step checks
    # noevia-web main so drift shows before the pin moves.
    name: HTTP routes cover the web client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Read the pinned web ref
        id: ref
        run: |
          set -euo pipefail
          ref=$(tr -d ' \n' < contracts/http/web.ref)
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::contracts/http/web.ref is not a 40-char SHA"; exit 1; }
          echo "sha=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: sbstndalton/noevia-web
          ref: ${{ steps.ref.outputs.sha }}
          path: web
      - run: python3 -m unittest tools/contracts/test_routes_check.py
      - run: python3 tools/contracts/routes_check.py --web web
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: sbstndalton/noevia-web
          path: web-main
      - name: Advisory, noevia-web main
        continue-on-error: true
        run: python3 tools/contracts/routes_check.py --web web-main

  corpus-replay-node:
    # /api/usage's hour-of-day histogram (hours, peakHour.hour) follows the wall clock of the replay,
    # not the server: those two body paths are left out of every replay (--ignore-body).
    # Full-Rust migration M0: the committed contract corpus must replay clean against the Node
    # server it was recorded from (noevia-core at contracts/http/core.ref, booted by its
    # tools/contract-corpus/serve.cjs: mock model and Diary, outbound connections refused, a fresh
    # copy of an empty data dir). A Rust slice later passes the same replay to take a route over.
    name: Contract corpus replays clean against Node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Read the pinned core ref
        id: ref
        run: |
          set -euo pipefail
          ref=$(tr -d ' \n' < contracts/http/core.ref)
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::contracts/http/core.ref is not a 40-char SHA"; exit 1; }
          echo "sha=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: sbstndalton/noevia-core
          ref: ${{ steps.ref.outputs.sha }}
          path: core
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci --no-fund --no-audit
        working-directory: core/server
      - uses: dtolnay/rust-toolchain@70dec6087f2cb6bab9fbac4da23160afbe848e91 # 1.99.0
        with:
          targets: wasm32-unknown-unknown
      # The server refuses to start without dav-parse.wasm at the noevia-rs ref core pins
      # (server/dav-parse.lock); build that ref, checksum-verified, as core's own CI does.
      - name: Build dav-parse.wasm at core's pinned noevia-rs ref
        working-directory: core
        run: |
          set -euo pipefail
          eval "$(grep -E '^(NOEVIA_RS_REF|NOEVIA_RS_SHA256|DAV_PARSE_WASM_SHA256)=[0-9a-f]+$' server/dav-parse.lock)"
          [[ "$NOEVIA_RS_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::dav-parse.lock NOEVIA_RS_REF is not a 40-char SHA"; exit 1; }
          curl -fsSL "https://codeload.github.com/sbstndalton/noevia-rs/tar.gz/$NOEVIA_RS_REF" -o "$RUNNER_TEMP/rs.tgz"
          echo "$NOEVIA_RS_SHA256  $RUNNER_TEMP/rs.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/rs-pin" && tar -xzf "$RUNNER_TEMP/rs.tgz" --strip-components=1 -C "$RUNNER_TEMP/rs-pin"
          "$RUNNER_TEMP/rs-pin/tools/build-dav-parse-wasm.sh" "$PWD/server/wasm/dav-parse.wasm"
          echo "$DAV_PARSE_WASM_SHA256  server/wasm/dav-parse.wasm" | sha256sum -c -
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --locked -p replay
      - name: Replay
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/seed"
          target/debug/replay run --corpus contracts/http/corpus --base http://127.0.0.1:18021 \
            --ignore-body hours --ignore-body peakHour/hour \
            --seed "$RUNNER_TEMP/seed" --work "$RUNNER_TEMP/work" \
            --server-cmd "exec '$GITHUB_WORKSPACE/target/debug/corpus-launcher' serve '$GITHUB_WORKSPACE/core'" \
            --report "$RUNNER_TEMP/replay-report.json" --state-out "$RUNNER_TEMP/node-state.json"
          target/debug/replay coverage --corpus contracts/http/corpus --routes contracts/http/routes.toml | tail -1
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: replay-node
          path: |
            ${{ runner.temp }}/replay-report.json
            ${{ runner.temp }}/node-state.json
          if-no-files-found: ignore

  corpus-replay-front:
    # Full-Rust migration M1: the same corpus, replayed through bins/noevia-server in front of the
    # same Node (tools/front/replay-front.sh: Node on UI_PORT+1000, the front on UI_PORT, as the web
    # image runs them with NOEVIA_FRONT=rust). Zero response differences, and the data dir the run
    # leaves must equal the one a Node-direct run leaves. The front's own streaming tests (SSE
    # flush per event, client abort reaching Node, X-Forwarded-For, body cap, route ownership)
    # run here by name as well as in the workspace tests.
    name: Contract corpus replays clean through the Rust front
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Read the pinned core ref
        id: ref
        run: |
          set -euo pipefail
          ref=$(tr -d ' \n' < contracts/http/core.ref)
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::contracts/http/core.ref is not a 40-char SHA"; exit 1; }
          echo "sha=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: sbstndalton/noevia-core
          ref: ${{ steps.ref.outputs.sha }}
          path: core
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci --no-fund --no-audit
        working-directory: core/server
      - uses: dtolnay/rust-toolchain@70dec6087f2cb6bab9fbac4da23160afbe848e91 # 1.99.0
        with:
          targets: wasm32-unknown-unknown
      - name: Build dav-parse.wasm at core's pinned noevia-rs ref
        working-directory: core
        run: |
          set -euo pipefail
          eval "$(grep -E '^(NOEVIA_RS_REF|NOEVIA_RS_SHA256|DAV_PARSE_WASM_SHA256)=[0-9a-f]+$' server/dav-parse.lock)"
          [[ "$NOEVIA_RS_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::dav-parse.lock NOEVIA_RS_REF is not a 40-char SHA"; exit 1; }
          curl -fsSL "https://codeload.github.com/sbstndalton/noevia-rs/tar.gz/$NOEVIA_RS_REF" -o "$RUNNER_TEMP/rs.tgz"
          echo "$NOEVIA_RS_SHA256  $RUNNER_TEMP/rs.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/rs-pin" && tar -xzf "$RUNNER_TEMP/rs.tgz" --strip-components=1 -C "$RUNNER_TEMP/rs-pin"
          "$RUNNER_TEMP/rs-pin/tools/build-dav-parse-wasm.sh" "$PWD/server/wasm/dav-parse.wasm"
          echo "$DAV_PARSE_WASM_SHA256  server/wasm/dav-parse.wasm" | sha256sum -c -
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --locked -p replay -p noevia-server
      - name: Front tests (SSE flush, client abort, forwarding, body cap, route ownership, code-net guard, timeouts)
        run: cargo test --locked -p noevia-server
      - name: Replay against Node directly (reference data dir)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/seed"
          target/debug/replay run --corpus contracts/http/corpus --base http://127.0.0.1:18021 \
            --ignore-body hours --ignore-body peakHour/hour \
            --seed "$RUNNER_TEMP/seed" --work "$RUNNER_TEMP/work-node" \
            --server-cmd "exec '$GITHUB_WORKSPACE/target/debug/corpus-launcher' serve '$GITHUB_WORKSPACE/core'" \
            --state-out "$RUNNER_TEMP/node-state.json"
      - name: Replay through the Rust front
        run: |
          set -euo pipefail
          target/debug/replay run --corpus contracts/http/corpus --base http://127.0.0.1:18021 \
            --ignore-body hours --ignore-body peakHour/hour \
            --seed "$RUNNER_TEMP/seed" --work "$RUNNER_TEMP/work-front" \
            --server-cmd "exec sh '$GITHUB_WORKSPACE/tools/front/replay-front.sh' '$GITHUB_WORKSPACE/core' '$GITHUB_WORKSPACE/target/debug/noevia-server'" \
            --report "$RUNNER_TEMP/replay-front-report.json" \
            --state-ignore '*projects.json.lock' --state-ignore '*free-chats.json.lock' --expect-state "$RUNNER_TEMP/node-state.json"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: replay-front
          path: |
            ${{ runner.temp }}/replay-front-report.json
            ${{ runner.temp }}/node-state.json
          if-no-files-found: ignore

  corpus-replay-front-rust-auth:
    # Full-Rust migration M3: the same corpus through the front with the deployment switch on.
    # The front answers sign-in and the account itself (crates/server-account), Node behind it
    # refuses to write the account tables (core server/rust-auth.cjs), and the replay must still
    # show zero differences and leave the data dir a Node-only run leaves.
    name: Contract corpus replays clean with Rust owning sign-in (NOEVIA_RUST_AUTH=1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Read the pinned core ref
        id: ref
        run: |
          set -euo pipefail
          ref=$(tr -d ' \n' < contracts/http/core.ref)
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::contracts/http/core.ref is not a 40-char SHA"; exit 1; }
          echo "sha=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: sbstndalton/noevia-core
          ref: ${{ steps.ref.outputs.sha }}
          path: core
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci --no-fund --no-audit
        working-directory: core/server
      - uses: dtolnay/rust-toolchain@70dec6087f2cb6bab9fbac4da23160afbe848e91 # 1.99.0
        with:
          targets: wasm32-unknown-unknown
      - name: Build dav-parse.wasm at core's pinned noevia-rs ref
        working-directory: core
        run: |
          set -euo pipefail
          eval "$(grep -E '^(NOEVIA_RS_REF|NOEVIA_RS_SHA256|DAV_PARSE_WASM_SHA256)=[0-9a-f]+$' server/dav-parse.lock)"
          [[ "$NOEVIA_RS_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::dav-parse.lock NOEVIA_RS_REF is not a 40-char SHA"; exit 1; }
          curl -fsSL "https://codeload.github.com/sbstndalton/noevia-rs/tar.gz/$NOEVIA_RS_REF" -o "$RUNNER_TEMP/rs.tgz"
          echo "$NOEVIA_RS_SHA256  $RUNNER_TEMP/rs.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/rs-pin" && tar -xzf "$RUNNER_TEMP/rs.tgz" --strip-components=1 -C "$RUNNER_TEMP/rs-pin"
          "$RUNNER_TEMP/rs-pin/tools/build-dav-parse-wasm.sh" "$PWD/server/wasm/dav-parse.wasm"
          echo "$DAV_PARSE_WASM_SHA256  server/wasm/dav-parse.wasm" | sha256sum -c -
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --locked -p replay -p noevia-server
      - name: Node's guard refuses exactly the tables and keys server-store owns
        run: NOEVIA_CORE_CHECKOUT="$GITHUB_WORKSPACE/core" cargo test --locked -p server-store --test node_guard
      - name: Replay against Node directly (reference data dir)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/seed"
          target/debug/replay run --corpus contracts/http/corpus --base http://127.0.0.1:18021 \
            --ignore-body hours --ignore-body peakHour/hour \
            --seed "$RUNNER_TEMP/seed" --work "$RUNNER_TEMP/work-node" \
            --server-cmd "exec '$GITHUB_WORKSPACE/target/debug/corpus-launcher' serve '$GITHUB_WORKSPACE/core'" \
            --state-out "$RUNNER_TEMP/node-state.json"
      - name: Replay through the Rust front with NOEVIA_RUST_AUTH=1
        run: |
          set -euo pipefail
          target/debug/replay run --corpus contracts/http/corpus --base http://127.0.0.1:18021 \
            --ignore-body hours --ignore-body peakHour/hour \
            --seed "$RUNNER_TEMP/seed" --work "$RUNNER_TEMP/work-front" \
            --server-cmd "exec env NOEVIA_RUST_AUTH=1 sh '$GITHUB_WORKSPACE/tools/front/replay-front.sh' '$GITHUB_WORKSPACE/core' '$GITHUB_WORKSPACE/target/debug/noevia-server'" \
            --report "$RUNNER_TEMP/replay-front-report.json" --state-out "$RUNNER_TEMP/rust-auth-state.json" \
            --state-ignore '*projects.json.lock' --state-ignore '*free-chats.json.lock' --expect-state "$RUNNER_TEMP/node-state.json"
      - name: "Negative control: Node alone with the switch on refuses the account writes"
        # Proves the guard engaged in the run above: without the front, sign-in and setup must fail
        # with 503 (core server/rust-auth.cjs), so the clean replay was the front's work. The
        # confirmation is what the supervisor (or replay-front.sh) gives Node after checking the front.
        run: |
          set -uo pipefail
          if target/debug/replay run --corpus contracts/http/corpus --base http://127.0.0.1:18021 \
              --ignore-body hours --ignore-body peakHour/hour \
              --seed "$RUNNER_TEMP/seed" --work "$RUNNER_TEMP/work-control" \
              --server-cmd "exec env NOEVIA_RUST_AUTH=1 NOEVIA_RUST_AUTH_CONFIRMED=1 '$GITHUB_WORKSPACE/target/debug/corpus-launcher' serve '$GITHUB_WORKSPACE/core'" \
              --report "$RUNNER_TEMP/control-report.json"; then
            echo "::error::Node with NOEVIA_RUST_AUTH=1 replayed clean: the single-writer guard did not engage"; exit 1
          fi
          python3 - "$RUNNER_TEMP/control-report.json" <<'PY'
          import json, sys
          rows = json.load(open(sys.argv[1]))
          setup = [r for r in rows if r["path"] == "/api/setup/complete" and r["expectedStatus"] == 201]
          assert setup and all(r["status"] == 503 for r in setup), setup
          print("negative control: Node refused setup with", setup[0]["status"])
          PY
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: replay-front-rust-auth
          path: |
            ${{ runner.temp }}/replay-front-report.json
            ${{ runner.temp }}/node-state.json
            ${{ runner.temp }}/rust-auth-state.json
          if-no-files-found: ignore

  corpus-replay-front-rust-projects:
    # Full-Rust migration M4, permanent since sbstndalton/noevia#1071 (NOEVIA_RUST_PROJECTS is
    # retired): the front always answers a project's image routes, its chat list and
    # GET/POST /api/freechats itself (crates/server-projects) and is the only writer of
    # projects.json and free-chats.json; Node's own project writers save through the front's
    # project store (#1264). Zero differences and the data dir a Node-only run leaves.
    name: Contract corpus replays clean with Rust owning the project routes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Read the pinned core ref
        id: ref
        run: |
          set -euo pipefail
          ref=$(tr -d ' \n' < contracts/http/core.ref)
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::contracts/http/core.ref is not a 40-char SHA"; exit 1; }
          echo "sha=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: sbstndalton/noevia-core
          ref: ${{ steps.ref.outputs.sha }}
          path: core
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci --no-fund --no-audit
        working-directory: core/server
      - uses: dtolnay/rust-toolchain@70dec6087f2cb6bab9fbac4da23160afbe848e91 # 1.99.0
        with:
          targets: wasm32-unknown-unknown
      - name: Build dav-parse.wasm at core's pinned noevia-rs ref
        working-directory: core
        run: |
          set -euo pipefail
          eval "$(grep -E '^(NOEVIA_RS_REF|NOEVIA_RS_SHA256|DAV_PARSE_WASM_SHA256)=[0-9a-f]+$' server/dav-parse.lock)"
          [[ "$NOEVIA_RS_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::dav-parse.lock NOEVIA_RS_REF is not a 40-char SHA"; exit 1; }
          curl -fsSL "https://codeload.github.com/sbstndalton/noevia-rs/tar.gz/$NOEVIA_RS_REF" -o "$RUNNER_TEMP/rs.tgz"
          echo "$NOEVIA_RS_SHA256  $RUNNER_TEMP/rs.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/rs-pin" && tar -xzf "$RUNNER_TEMP/rs.tgz" --strip-components=1 -C "$RUNNER_TEMP/rs-pin"
          "$RUNNER_TEMP/rs-pin/tools/build-dav-parse-wasm.sh" "$PWD/server/wasm/dav-parse.wasm"
          echo "$DAV_PARSE_WASM_SHA256  server/wasm/dav-parse.wasm" | sha256sum -c -
      - name: The committed chat-list fixture is core.ref's route output (sbstndalton/noevia#1411)
        run: |
          set -euo pipefail
          node tools/gen-project-chats-fixtures.cjs "$GITHUB_WORKSPACE/core" "$RUNNER_TEMP/node-chats.v1.json"
          cmp crates/server-projects/tests/fixtures/node-chats.v1.json "$RUNNER_TEMP/node-chats.v1.json" \
            || { echo "::error::regenerate crates/server-projects/tests/fixtures/node-chats.v1.json with tools/gen-project-chats-fixtures.cjs at contracts/http/core.ref"; exit 1; }
      - name: The committed free-chat fixture is core.ref's route output
        run: |
          set -euo pipefail
          node tools/gen-free-chats-fixtures.cjs "$GITHUB_WORKSPACE/core" "$RUNNER_TEMP/node-free-chats.v1.json"
          cmp crates/server-projects/tests/fixtures/node-free-chats.v1.json "$RUNNER_TEMP/node-free-chats.v1.json" \
            || { echo "::error::regenerate crates/server-projects/tests/fixtures/node-free-chats.v1.json with tools/gen-free-chats-fixtures.cjs at contracts/http/core.ref"; exit 1; }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build the front with both chat-list slices
        run: |
          set -euo pipefail
          cargo build --locked -p replay -p noevia-server --features rust-project-chats,rust-free-chats
          target/debug/noevia-server --features | grep -qx rust-project-chats
          target/debug/noevia-server --features | grep -qx rust-free-chats
      - name: The chat-list slices' routing and capability tests
        # The free slice alone first: each `cargo test` rebuilds target/debug/noevia-server with its
        # features, and the replays below must run the front with both slices.
        run: |
          set -euo pipefail
          cargo clippy --locked -p noevia-server --all-targets --features rust-free-chats -- -D warnings
          cargo test --locked -p noevia-server --features rust-free-chats
          cargo clippy --locked -p noevia-server --all-targets --features rust-project-chats,rust-free-chats -- -D warnings
          cargo test --locked -p noevia-server --features rust-project-chats,rust-free-chats
          cargo build --locked -p replay -p noevia-server --features rust-project-chats,rust-free-chats
          target/debug/noevia-server --features | grep -qx rust-project-chats
          target/debug/noevia-server --features | grep -qx rust-free-chats
      - name: Node and Rust share the projects.json and free-chats.json locks and lose no write (and the blind-save controls do); generated chat-list saves answer as core's route
        run: NOEVIA_CORE_CHECKOUT="$GITHUB_WORKSPACE/core" cargo test --locked -p server-projects --test node_lock --test chats_property --test free_chats_property
      - name: Replay against Node directly (reference data dir)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/seed"
          target/debug/replay run --corpus contracts/http/corpus --base http://127.0.0.1:18021 \
            --ignore-body hours --ignore-body peakHour/hour \
            --seed "$RUNNER_TEMP/seed" --work "$RUNNER_TEMP/work-node" \
            --server-cmd "exec '$GITHUB_WORKSPACE/target/debug/corpus-launcher' serve '$GITHUB_WORKSPACE/core'" \
            --state-out "$RUNNER_TEMP/node-state.json"
      - name: Replay through the Rust front
        run: |
          set -euo pipefail
          features="$(target/debug/noevia-server --features)"
          grep -qx rust-project-chats <<<"$features" && grep -qx rust-free-chats <<<"$features" \
            || { echo "::error::the front under test lacks a chat slice"; exit 1; }
          target/debug/replay run --corpus contracts/http/corpus --base http://127.0.0.1:18021 \
            --ignore-body hours --ignore-body peakHour/hour \
            --seed "$RUNNER_TEMP/seed" --work "$RUNNER_TEMP/work-front" \
            --server-cmd "exec sh '$GITHUB_WORKSPACE/tools/front/replay-front.sh' '$GITHUB_WORKSPACE/core' '$GITHUB_WORKSPACE/target/debug/noevia-server'" \
            --report "$RUNNER_TEMP/replay-front-report.json" --state-out "$RUNNER_TEMP/rust-projects-state.json" \
            --state-ignore '*projects.json.lock' --state-ignore '*free-chats.json.lock' \
            --expect-state "$RUNNER_TEMP/node-state.json"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: replay-front-rust-projects
          path: |
            ${{ runner.temp }}/replay-front-report.json
            ${{ runner.temp }}/node-state.json
            ${{ runner.temp }}/rust-projects-state.json
            ${{ runner.temp }}/node-chats.v1.json
            ${{ runner.temp }}/node-free-chats.v1.json
          if-no-files-found: ignore

  dav-parse-wasm:
    # noevia#967 (+ #976 s3-list-parse, #978 storage-path, #977 upload-sniff, #979 secret-envelope, #980 mcp-frame, #1002 chat-template-caps and provider-error, #1003 autotune-plan, #1062 tune-contention, #769/#740 prompt-framing, #1079 long-profile, s3-sign, #795 ssrf-policy, #516/#704 stream-guard, gguf-meta, policy-leaves, review-verdict, tool-exchange, mcp-servers, decision, code-net-guard, role-context, completeness-report, task-lifecycle, llamacpp-autoconfig, code-actions, project-file-names, provider-egress, browser-policy, tool-gate, toolboxes-permitted, llamacpp-presets, project-edit-target in the same module): dav-parse.wasm is consumed by noevia-core at a pinned sha256, so the build must be
    # reproducible. Build it twice from clean target dirs, require identical bytes, and record the
    # digest in the job summary (compare it with DAV_PARSE_WASM_SHA256 in noevia-core's
    # server/dav-parse.lock when re-pinning).
    name: dav-parse.wasm (reproducible build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@70dec6087f2cb6bab9fbac4da23160afbe848e91 # 1.99.0
        with:
          targets: wasm32-unknown-unknown
      - name: Build twice and compare
        run: |
          set -euo pipefail
          rustup target add wasm32-unknown-unknown
          tools/build-dav-parse-wasm.sh "$RUNNER_TEMP/a.wasm"
          rm -rf target
          tools/build-dav-parse-wasm.sh "$RUNNER_TEMP/b.wasm"
          cmp "$RUNNER_TEMP/a.wasm" "$RUNNER_TEMP/b.wasm"
          sha=$(sha256sum "$RUNNER_TEMP/a.wasm" | cut -d' ' -f1)
          echo "dav-parse.wasm sha256: \`$sha\` ($(stat -c %s "$RUNNER_TEMP/a.wasm") bytes)" >> "$GITHUB_STEP_SUMMARY"
          echo "dav-parse.wasm sha256 $sha"
      - name: No imports, expected exports
        run: |
          node -e '
            const m = new WebAssembly.Module(require("fs").readFileSync(process.argv[1]));
            const imports = WebAssembly.Module.imports(m), exports = WebAssembly.Module.exports(m).map((e) => e.name);
            if (imports.length) { console.error("unexpected imports", imports); process.exit(1); }
            for (const n of ["memory", "dav_input", "dav_list", "s3_list", "storage_path", "upload_validate", "upload_classify", "upload_decode", "secret_open", "secret_seal", "mcp_rpc_body", "mcp_schema_refs", "template_caps", "provider_error", "serving_verdict", "autotune_plan", "frame_untrusted", "escape_closing", "provenance", "task_packet", "s3_sign", "s3_region", "long_profile", "ssrf_policy", "stream_guard", "gguf_summary", "auth_tokens", "tool_policy", "llamacpp_presets", "project_edit_target", "dav_output_ptr", "dav_output_len"])
              if (!exports.includes(n)) { console.error("missing export", n); process.exit(1); }
          ' "$RUNNER_TEMP/a.wasm"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dav-parse-wasm
          path: ${{ runner.temp }}/a.wasm

  sandbox-bridge-wasm:
    # noevia#999: sandbox-bridge.wasm (the code sandbox bridge's framing, toolCallFor, start line and
    # containment rules) is consumed by noevia-core at a pinned sha256 (code-sandbox/sandbox-bridge.lock),
    # so the build must be reproducible. Build it twice from clean target dirs, require identical
    # bytes, check the ABI, and record the digest in the job summary.
    name: sandbox-bridge.wasm (reproducible build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@70dec6087f2cb6bab9fbac4da23160afbe848e91 # 1.99.0
        with:
          targets: wasm32-unknown-unknown
      - name: Build twice and compare
        run: |
          set -euo pipefail
          rustup target add wasm32-unknown-unknown
          tools/build-sandbox-bridge-wasm.sh "$RUNNER_TEMP/a.wasm"
          rm -rf target
          tools/build-sandbox-bridge-wasm.sh "$RUNNER_TEMP/b.wasm"
          cmp "$RUNNER_TEMP/a.wasm" "$RUNNER_TEMP/b.wasm"
          sha=$(sha256sum "$RUNNER_TEMP/a.wasm" | cut -d' ' -f1)
          echo "sandbox-bridge.wasm sha256: \`$sha\` ($(stat -c %s "$RUNNER_TEMP/a.wasm") bytes)" >> "$GITHUB_STEP_SUMMARY"
          echo "sandbox-bridge.wasm sha256 $sha"
      - name: No imports, expected exports
        run: |
          node -e '
            const m = new WebAssembly.Module(require("fs").readFileSync(process.argv[1]));
            const imports = WebAssembly.Module.imports(m), exports = WebAssembly.Module.exports(m).map((e) => e.name);
            if (imports.length) { console.error("unexpected imports", imports); process.exit(1); }
            for (const n of ["memory", "sb_input", "sb_frame_new", "sb_frame_push", "sb_frame_reset", "sb_frame_free", "sb_tool_call", "sb_start", "sb_contained", "sb_output_ptr", "sb_output_len"])
              if (!exports.includes(n)) { console.error("missing export", n); process.exit(1); }
          ' "$RUNNER_TEMP/a.wasm"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sandbox-bridge-wasm
          path: ${{ runner.temp }}/a.wasm

  passkey-compat:
    # Full-Rust migration M3: passkeys registered under Node must sign in under Rust and the
    # reverse. tools/gen-passkey-fixtures.cjs builds registrations and assertions with a software
    # authenticator and has noevia-core's own @simplewebauthn/server v14 (at contracts/http/core.ref)
    # verify each; crates/passkey must reach every verdict, store exactly what auth.cjs stores and
    # return the same counter. Keys are random per run, so the test runs on the fresh output.
    name: Passkeys verify like @simplewebauthn
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Read the pinned core ref
        id: ref
        run: |
          set -euo pipefail
          ref=$(tr -d ' \n' < contracts/http/core.ref)
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::contracts/http/core.ref is not a 40-char SHA"; exit 1; }
          echo "sha=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: sbstndalton/noevia-core
          ref: ${{ steps.ref.outputs.sha }}
          path: core
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci --no-fund --no-audit
        working-directory: core/server
      - name: Generate registrations and assertions with @simplewebauthn
        run: NOEVIA_CORE_CHECKOUT="$PWD/core" node tools/gen-passkey-fixtures.cjs > "$RUNNER_TEMP/simplewebauthn-v14.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: passkey-fixture
          path: ${{ runner.temp }}/simplewebauthn-v14.json
      - uses: dtolnay/rust-toolchain@70dec6087f2cb6bab9fbac4da23160afbe848e91 # 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Rust agrees with @simplewebauthn on the fresh output
        run: NOEVIA_PASSKEY_FIXTURE="$RUNNER_TEMP/simplewebauthn-v14.json" cargo test --locked -p passkey --test compat

  auth-differential:
    # Full-Rust migration M2: crates/server-auth must give Node's verdicts. tools/gen-auth-fixtures.cjs
    # runs noevia-core's own auth code (at contracts/http/core.ref) over synthetic databases and
    # requests; the committed fixture must equal that output byte for byte, and the Rust
    # differential test runs against the freshly generated file as well as the committed one.
    name: Auth verdicts match Node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Read the pinned core ref
        id: ref
        run: |
          set -euo pipefail
          ref=$(tr -d ' \n' < contracts/http/core.ref)
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::contracts/http/core.ref is not a 40-char SHA"; exit 1; }
          echo "sha=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: sbstndalton/noevia-core
          ref: ${{ steps.ref.outputs.sha }}
          path: core
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci --no-fund --no-audit
        working-directory: core/server
      - name: Generate the fixture from Node
        run: NOEVIA_CORE_CHECKOUT="$PWD/core" node tools/gen-auth-fixtures.cjs > "$RUNNER_TEMP/node-auth.v1.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: node-auth-fixture
          path: ${{ runner.temp }}/node-auth.v1.json
      - uses: dtolnay/rust-toolchain@70dec6087f2cb6bab9fbac4da23160afbe848e91 # 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Rust agrees with the fresh Node output
        run: NOEVIA_AUTH_FIXTURE="$RUNNER_TEMP/node-auth.v1.json" cargo test --locked -p server-auth --test differential
      - name: The committed fixture is current
        run: |
          cmp crates/server-auth/tests/fixtures/node-auth.v1.json "$RUNNER_TEMP/node-auth.v1.json" \
            || { echo "::error::regenerate crates/server-auth/tests/fixtures/node-auth.v1.json with tools/gen-auth-fixtures.cjs"; exit 1; }

  native-model-manager:
    name: Native model-manager policy, bounded Docker transport and omission
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: sbstndalton/noevia-services
          ref: ff8f314d7496e83d3b2d229089f8aabb4ddf67f9
          path: legacy-services
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: sbstndalton/noevia-services
          # noevia#1972: the services fix changes api.py (the delete route reserves its folder), which the oracle hashes.
          ref: a14df916b1907ac6a0ed3334668a89b8b72dd871
          path: sections-services
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@70dec6087f2cb6bab9fbac4da23160afbe848e91 # 1.99.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Regenerate actual Python policy fixture without starting the app
        run: |
          cargo run --locked -q -p noevia-model-manager --bin generate-oracle -- legacy-services/model-manager/app/api.py > "$RUNNER_TEMP/logs.json"
          cmp bins/noevia-model-manager/tests/fixtures/logs.json "$RUNNER_TEMP/logs.json"
      - name: Regenerate actual Python host oracle
        run: |
          cargo run --locked -q -p noevia-model-manager --bin generate-host-oracle -- legacy-services/model-manager/app > "$RUNNER_TEMP/host.json"
          cmp bins/noevia-model-manager/tests/fixtures/host.json "$RUNNER_TEMP/host.json"
      - name: Install fixed section oracle framework
        run: python3 -m pip install fastapi==0.115.6 httpx==0.28.1
      - name: Regenerate actual section schema and complete response oracle
        run: |
          cargo run --locked -q -p noevia-model-manager --bin generate-sections-schema -- legacy-services/model-manager/app "$RUNNER_TEMP/sections-schema.json"
          cmp bins/noevia-model-manager/src/sections/schema.json "$RUNNER_TEMP/sections-schema.json"
          cargo run --locked -q -p noevia-model-manager --bin generate-sections-oracle -- sections-services/model-manager/app "$RUNNER_TEMP/sections.json"
          cmp bins/noevia-model-manager/tests/fixtures/sections.json "$RUNNER_TEMP/sections.json"
      - run: cargo clippy --locked -p noevia-model-manager --all-targets --features native-host,native-sections -- -D warnings
      - name: Native host differential and synthetic sampler lifecycle
        env:
          NOEVIA_HOST_FIXTURE: ${{ runner.temp }}/host.json
        run: cargo test --locked -p noevia-model-manager --features native-host,native-sections
      - name: Tighter GGUF component limits and section policy mutations
        run: |
          cargo test --locked -p gguf --test limits
          cargo run --locked -q -p noevia-model-manager --bin check-sections-mutations
      - name: Host behavior mutations must fail assertions
        run: cargo run --locked -q -p noevia-model-manager --bin check-host-mutations
      - name: Host capability omission (logs-only)
        run: cargo test --locked -p noevia-model-manager --features native-logs --test lifecycle
      - name: Feature omission refuses before legacy child spawn
        run: cargo test --locked -p noevia-model-manager --no-default-features --test lifecycle

  native-prompts:
    name: Native prompt CRUD, seed, actual Python differential and omission
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: sbstndalton/noevia-services
          ref: 2360cb51f6475122ba0aa3d32272849a63028d66
          path: prompts-services
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: sbstndalton/noevia-services
          ref: 6c233f4a05730ed5dccd7997ae601e9999eaa6d7
          path: prompts-runtime
      - name: Read actual merged core pin
        id: prompts-core
        run: |
          set -euo pipefail
          ref=$(tr -d ' \n' < contracts/http/core.ref)
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: sbstndalton/noevia-core
          ref: ${{ steps.prompts-core.outputs.sha }}
          path: prompts-core
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install immutable core dependencies outside the source checkout
        run: |
          set -euo pipefail
          umask 077
          dependency_root="$RUNNER_TEMP/prompts-node-dependencies"
          mkdir -m 700 "$dependency_root"
          ref="${{ steps.prompts-core.outputs.sha }}"
          git -C prompts-core show "$ref:server/package.json" > "$dependency_root/package.json"
          git -C prompts-core show "$ref:server/package-lock.json" > "$dependency_root/package-lock.json"
          cmp prompts-core/server/package.json "$dependency_root/package.json"
          cmp prompts-core/server/package-lock.json "$dependency_root/package-lock.json"
          npm ci --prefix "$dependency_root" --no-fund --no-audit
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@70dec6087f2cb6bab9fbac4da23160afbe848e91 # 1.99.0
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install recorded oracle framework resolution
        run: |
          python3 -m pip install -r prompts-runtime/model-manager/requirements.txt
          python3 -m pip install fastapi==0.115.6 httpx==0.28.1 pydantic==2.14.0 pydantic-core==2.50.0 starlette==0.41.3
      - name: Build independently pinned actual-core WASM prerequisite
        run: |
          set -euo pipefail
          eval "$(grep -E '^(NOEVIA_RS_REF|NOEVIA_RS_SHA256|DAV_PARSE_WASM_SHA256)=[0-9a-f]+$' prompts-core/server/dav-parse.lock)"
          [[ "$NOEVIA_RS_REF" =~ ^[0-9a-f]{40}$ ]]
          curl -fsSL "https://codeload.github.com/sbstndalton/noevia-rs/tar.gz/$NOEVIA_RS_REF" -o "$RUNNER_TEMP/prompts-wasm.tgz"
          echo "$NOEVIA_RS_SHA256  $RUNNER_TEMP/prompts-wasm.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/prompts-wasm"
          tar -xzf "$RUNNER_TEMP/prompts-wasm.tgz" --strip-components=1 -C "$RUNNER_TEMP/prompts-wasm"
          "$RUNNER_TEMP/prompts-wasm/tools/build-dav-parse-wasm.sh" "$GITHUB_WORKSPACE/prompts-core/server/wasm/dav-parse.wasm"
          echo "$DAV_PARSE_WASM_SHA256  prompts-core/server/wasm/dav-parse.wasm" | sha256sum -c -
      - name: Execute immutable actual Python API and SQLite oracle
        env:
          PYTHON: python3
        run: |
          cargo run --locked -q -p noevia-model-manager --bin generate-prompts-oracle -- prompts-services/model-manager/app "$RUNNER_TEMP/prompts.json"
          cargo run --locked -q -p noevia-model-manager --bin check-prompts-oracle -- "$RUNNER_TEMP/prompts.json"
      - run: cargo clippy --locked -p noevia-model-manager --all-targets --features native-host,native-sections,native-prompts -- -D warnings
      - name: Full native differential, synthetic stores and lifecycle
        env:
          NOEVIA_PROMPTS_ORACLE: ${{ runner.temp }}/prompts.json
          NOEVIA_PROMPTS_APP: ${{ github.workspace }}/prompts-services/model-manager/app
          PYTHON: python3
        run: cargo test --locked -p noevia-model-manager --features native-host,native-sections,native-prompts
      - name: Shared compatibility defaults
        run: |
          cargo test --locked -p model-files
          cargo test --locked -p gguf
      - name: Native prompt capability omission
        run: |
          cargo test --locked -p noevia-model-manager --features native-logs --test lifecycle
          cargo test --locked -p noevia-model-manager --no-default-features --test lifecycle
      - name: Native prompt behavior mutations must fail assertions
        run: cargo run --locked -q -p noevia-model-manager --bin check-prompts-mutations
      - name: Actual public front, Node proxy and native prompt binary differential
        env:
          PYTHON: python3
          NOEVIA_PROMPTS_DEPENDENCIES: ${{ runner.temp }}/prompts-node-dependencies
        run: |
          cargo build --locked -p noevia-model-manager --features native-prompts
          cargo build --locked -p noevia-server --bin noevia-server
          cargo build --locked -p replay --bin corpus-launcher --bin prompts-contracts
          cargo clippy --locked -p replay --bin corpus-launcher --bin prompts-contracts -- -D warnings
          cargo test --locked -p replay --bin prompts-contracts
          cargo test --locked -p replay --bin corpus-launcher capture_tests::verified_dependency_override_preserves_literal_spawn_options -- --exact
          target/debug/corpus-launcher verify "$PWD/prompts-core"
          target/debug/prompts-contracts "$PWD/prompts-core" "$PWD/prompts-runtime/model-manager/app" "$RUNNER_TEMP/prompts-publicfront.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-prompts-actual-python-oracle
          path: |
