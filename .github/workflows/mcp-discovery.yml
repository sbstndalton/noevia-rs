name: Native MCP discovery
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# A newer push to a pull request cancels its superseded run. Push runs (main only) are keyed by
# commit, so none is ever cancelled or replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # tools/ci/changed_areas.py: on a pull request that only changes leaf crates nobody depends on
  # or names (and docs), the jobs below are skipped (a skipped job satisfies a required check);
  # anything else runs them all.
  changes:
    uses: ./.github/workflows/changed-areas.yml
  mcp-discovery:
    needs: changes
    if: needs.changes.outputs.full != 'false'
    name: Required native MCP discovery contracts (row T)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Read the oracle's core pin
        # The last core whose mcp-wiring.cjs owns discovery (later cores ask the front for it).
        id: core
        run: |
          set -euo pipefail
          ref=$(tr -d ' \n' < bins/noevia-server/tests/fixtures/mcp-discovery-oracle.core-ref)
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: sbstndalton/noevia-core
          ref: ${{ steps.core.outputs.sha }}
          path: core
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - uses: dtolnay/rust-toolchain@70dec6087f2cb6bab9fbac4da23160afbe848e91
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked -p noevia-server --all-targets -- -D warnings
      - name: Actual core wiring reproduces the committed scenarios
        # core's own createMcpWiring, bindBoxes, directory-mcp, toolboxes, manifest and mcp-internal over a scripted
        # transport and a virtual clock.
        run: |
          set -euo pipefail
          node bins/noevia-server/tests/mcp-discovery-oracle.cjs "$PWD/core" "$RUNNER_TEMP/mcp-discovery-node.json"
          cmp "$RUNNER_TEMP/mcp-discovery-node.json" bins/noevia-server/tests/fixtures/mcp-discovery-node.v1.json
      - name: The actor replays every scenario, the manifest, the token and the cancellation cases
        env:
          NOEVIA_MCP_DISCOVERY_FIXTURE: ${{ runner.temp }}/mcp-discovery-node.json
        run: cargo test --locked -p noevia-server --test mcp_discovery_actor
      - name: The catalogue and the picker the front composes
        run: cargo test --locked -p noevia-server --lib mcp_discovery
