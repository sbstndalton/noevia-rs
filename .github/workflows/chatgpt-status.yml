name: Native ChatGPT connection status GET
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  chatgpt-status-native:
    name: Required native ChatGPT status contracts (#1373)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Read actual merged core pin
        id: core
        run: |
          set -euo pipefail
          ref=$(tr -d ' \n' < contracts/http/core.ref)
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: sbstndalton/noevia-core
          ref: ${{ steps.core.outputs.sha }}
          path: core
      - name: Read the oracle core pin (core main with the plan projection, core#135 and later)
        id: oracle
        run: |
          set -euo pipefail
          ref=$(tr -d ' \n' < crates/server-chatgpt-status/tests/oracle-core.ref)
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: sbstndalton/noevia-core
          ref: ${{ steps.oracle.outputs.sha }}
          path: oracle-core
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - uses: dtolnay/rust-toolchain@70dec6087f2cb6bab9fbac4da23160afbe848e91
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked -p server-chatgpt-status -p server-auth -p server-storage-reads -p noevia-server --all-targets --features noevia-server/rust-chatgpt-status -- -D warnings
      - run: npm ci --no-fund --no-audit
        working-directory: oracle-core/server
      - name: Actual core status oracle reproduces the committed corpus
        # core's own auth.cjs, secrets.cjs, secret-envelope.cjs, chatgpt-oauth.cjs, features.cjs,
        # routes/providers.cjs and http.cjs over synthetic tenants and keys.
        run: |
          set -euo pipefail
          node crates/server-chatgpt-status/tests/oracle.cjs "$PWD/oracle-core" "$RUNNER_TEMP/node-chatgpt-status.json"
          cmp "$RUNNER_TEMP/node-chatgpt-status.json" crates/server-chatgpt-status/tests/fixtures/node-chatgpt-status.v1.json
      - name: Node-differential status, flag seam, tenant isolation, schema and byte bounds
        run: NOEVIA_CHATGPT_STATUS_FIXTURE="$RUNNER_TEMP/node-chatgpt-status.json" cargo test --locked -p server-chatgpt-status -p server-auth -p server-storage-reads
      - name: Real HTTP gate, headers, siblings and switch through the front
        run: |
          set -euo pipefail
          cargo test --locked -p noevia-server --features rust-chatgpt-status
          cargo test --locked -p noevia-server --features rust-chatgpt-status,rust-storage-reads,rust-export,rust-free-chats,rust-stats
      - name: Compiled capability and startup refusals
        run: |
          set -euo pipefail
          cargo build --locked --target-dir target/chatgpt-featureless -p noevia-server --no-default-features
          if target/chatgpt-featureless/debug/noevia-server --features | grep -qx rust-chatgpt-status; then exit 1; fi
          if NOEVIA_LEGACY_UPSTREAM=http://127.0.0.1:9 UI_DATA_DIR=/tmp target/chatgpt-featureless/debug/noevia-server > "$RUNNER_TEMP/chatgpt-featureless.log" 2>&1; then exit 1; fi
          grep -q 'needs compiled rust-chatgpt-status' "$RUNNER_TEMP/chatgpt-featureless.log"
          cargo build --locked -p replay -p noevia-server --features noevia-server/rust-chatgpt-status
          target/debug/noevia-server --features | grep -qx rust-chatgpt-status
      - run: npm ci --no-fund --no-audit
        working-directory: core/server
      - name: Build dav-parse.wasm at core's pinned noevia-rs ref
        working-directory: core
        run: |
          set -euo pipefail
          eval "$(grep -E '^(NOEVIA_RS_REF|NOEVIA_RS_SHA256|DAV_PARSE_WASM_SHA256)=[0-9a-f]+$' server/dav-parse.lock)"
          [[ "$NOEVIA_RS_REF" =~ ^[0-9a-f]{40}$ ]]
          curl -fsSL "https://codeload.github.com/sbstndalton/noevia-rs/tar.gz/$NOEVIA_RS_REF" -o "$RUNNER_TEMP/rs.tgz"
          echo "$NOEVIA_RS_SHA256  $RUNNER_TEMP/rs.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/rs-pin" && tar -xzf "$RUNNER_TEMP/rs.tgz" --strip-components=1 -C "$RUNNER_TEMP/rs-pin"
          "$RUNNER_TEMP/rs-pin/tools/build-dav-parse-wasm.sh" "$PWD/server/wasm/dav-parse.wasm"
          echo "$DAV_PARSE_WASM_SHA256  server/wasm/dav-parse.wasm" | sha256sum -c -
      # Front replays run behind the Core generation paired with this front (front-core.ref).
      - uses: ./.github/actions/paired-core
      - name: Replay against Node directly (reference data dir)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/seed"
          target/debug/replay run --corpus contracts/http/corpus --base http://127.0.0.1:18021 \
            --ignore-body hours --ignore-body peakHour/hour \
            --seed "$RUNNER_TEMP/seed" --work "$RUNNER_TEMP/work-node" \
            --server-cmd "exec '$GITHUB_WORKSPACE/target/debug/corpus-launcher' serve '$GITHUB_WORKSPACE/core'" \
            --state-out "$RUNNER_TEMP/node-state.json"
      - name: Full replay through the front with NOEVIA_RUST_AUTH=1
        # Every file and every cowork.db row must be Node's: the status read writes nothing.
        run: |
          set -euo pipefail
          target/debug/replay run --corpus contracts/http/corpus --base http://127.0.0.1:18021 \
            --ignore-body hours --ignore-body peakHour/hour \
            --seed "$RUNNER_TEMP/seed" --work "$RUNNER_TEMP/work-chatgpt" \
            --native-move-state --server-cmd "exec env NOEVIA_RUST_AUTH=1 sh '$GITHUB_WORKSPACE/tools/front/replay-front.sh' '$GITHUB_WORKSPACE/front-core' '$GITHUB_WORKSPACE/target/debug/noevia-server'" \
            --report "$RUNNER_TEMP/chatgpt-positive.json" \
            --state-ignore '*projects.json.lock' --state-ignore '*free-chats.json.lock' --state-ignore '*chat-transcripts.lock' --state-ignore '*chat-changes.jsonl' --expect-state "$RUNNER_TEMP/node-state.json"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-chatgpt-status-evidence
          path: |
            ${{ runner.temp }}/node-chatgpt-status.json
            ${{ runner.temp }}/chatgpt-positive.json
            ${{ runner.temp }}/node-state.json
          if-no-files-found: ignore
