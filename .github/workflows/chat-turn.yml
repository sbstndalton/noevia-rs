name: Recorded chat turns
on:
  push:
    branches: [main]
    paths: ['crates/chat-turn/**', '.github/workflows/chat-turn.yml']
  pull_request:
    paths: ['crates/chat-turn/**', '.github/workflows/chat-turn.yml']
permissions:
  contents: read
jobs:
  chat-turn-recording:
    name: Chat turns recorded from core's chat.cjs reproduce
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Read the recording's core pin
        id: oracle
        run: |
          set -euo pipefail
          ref=$(tr -d ' \n' < crates/chat-turn/tests/oracle-core.ref)
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: sbstndalton/noevia-core
          ref: ${{ steps.oracle.outputs.sha }}
          path: oracle-core
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - name: The core's own turn record and partial entry reproduce the committed recording
        # Synthetic QA event sequences through chat-interrupted-turn.cjs createTurnRecord and chat-partial.cjs; no
        # network. Before the wasm build: these two modules do not load dav-parse, so a build failure cannot hide it.
        run: NOEVIA_CORE_CHECKOUT="$PWD/oracle-core" node crates/chat-turn/tests/record_entries.cjs --check crates/chat-turn/tests/fixtures/node-turn-record.v1.json
      - name: The core's own reduceToolResult reproduces the committed recording
        # Synthetic QA tool results through server/tool-result-reduce.cjs; needs no wasm.
        run: NOEVIA_CORE_CHECKOUT="$PWD/oracle-core" node crates/chat-turn/tests/record_reduce.cjs --check crates/chat-turn/tests/fixtures/node-reduce.v1.json
      - name: The core's own chat-sources.cjs attribution reproduces the committed recording
        # Synthetic QA files, answers and questions through chat-sources.cjs and rust-chat-native.cjs injectedSources; needs no wasm.
        run: NOEVIA_CORE_CHECKOUT="$PWD/oracle-core" RECORD_FRESH="$RUNNER_TEMP/node-sources.v1.json" node crates/chat-turn/tests/record_sources.cjs --check crates/chat-turn/tests/fixtures/node-sources.v1.json
      # From here on every recording runs even when one above differs, so one run gives every fresh recording.
      - if: ${{ !cancelled() }}
        uses: dtolnay/rust-toolchain@70dec6087f2cb6bab9fbac4da23160afbe848e91 # 1.99.0
        with:
          targets: wasm32-unknown-unknown
      - name: Build dav-parse.wasm at the core's pinned noevia-rs ref
        if: ${{ !cancelled() }}
        working-directory: oracle-core
        run: |
          set -euo pipefail
          eval "$(grep -E '^(NOEVIA_RS_REF|NOEVIA_RS_SHA256|DAV_PARSE_WASM_SHA256)=[0-9a-f]+$' server/dav-parse.lock)"
          [[ "$NOEVIA_RS_REF" =~ ^[0-9a-f]{40}$ ]]
          curl -fsSL "https://codeload.github.com/sbstndalton/noevia-rs/tar.gz/$NOEVIA_RS_REF" -o "$RUNNER_TEMP/rs.tgz"
          echo "$NOEVIA_RS_SHA256  $RUNNER_TEMP/rs.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/rs-pin" && tar -xzf "$RUNNER_TEMP/rs.tgz" --strip-components=1 -C "$RUNNER_TEMP/rs-pin"
          "$RUNNER_TEMP/rs-pin/tools/build-dav-parse-wasm.sh" "$PWD/server/wasm/dav-parse.wasm"
          echo "$DAV_PARSE_WASM_SHA256  server/wasm/dav-parse.wasm" | sha256sum -c -
      - name: The core's own handleChat reproduces the committed recording
        if: ${{ !cancelled() }}
        # Synthetic QA turns through server/chat.cjs with a scripted engine and stub stores; no network. When it
        # differs, the fresh recording is uploaded below (chat-turn-recording), for a host that cannot run Node.
        run: NOEVIA_CORE_CHECKOUT="$PWD/oracle-core" RECORD_FRESH="$RUNNER_TEMP/node-turns.v1.json" node crates/chat-turn/tests/record_turns.cjs --check crates/chat-turn/tests/fixtures/node-turns.v1.json
      - name: The core's own chat-title.cjs reproduces the committed title recording
        if: ${{ !cancelled() }}
        # Synthetic QA inputs through server/chat-title.cjs with a recording fake fetch; no network.
        run: NOEVIA_CORE_CHECKOUT="$PWD/oracle-core" node crates/chat-turn/tests/record_titles.cjs --check crates/chat-turn/tests/fixtures/node-titles.v1.json
      - name: The core's own search-query, announced-action, final-answer and tool-route-notes reproduce the helper recording
        if: ${{ !cancelled() }}
        # Synthetic QA inputs through the four pure server/*.cjs helpers (and tools-mode.cjs for the Automatic web bit); no network.
        run: NOEVIA_CORE_CHECKOUT="$PWD/oracle-core" node crates/chat-turn/tests/record_helpers.cjs --check crates/chat-turn/tests/fixtures/node-helpers.v1.json
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chat-turn-recording
          path: |
            ${{ runner.temp }}/node-turns.v1.json
            ${{ runner.temp }}/node-sources.v1.json
          if-no-files-found: ignore
