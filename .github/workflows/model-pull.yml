name: Recorded model pull
on:
  push:
    branches: [main]
    paths: ['crates/model-pull/**', '.github/workflows/model-pull.yml']
  pull_request:
    paths: ['crates/model-pull/**', '.github/workflows/model-pull.yml']
permissions:
  contents: read
jobs:
  model-pull-recording:
    name: Model pull recorded from core reproduces
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Read the recording's core pin
        id: oracle
        run: |
          set -euo pipefail
          ref=$(tr -d ' \n' < crates/model-pull/tests/oracle-core.ref)
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: sbstndalton/noevia-core
          ref: ${{ steps.oracle.outputs.sha }}
          path: oracle-core
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - name: The core's own models route lines, models.cjs deriveUserModelName, the managers, llamacpp-variants.cjs and mtp-artifact.cjs reproduce the committed recording
        # Synthetic QA bodies, manager answers, Hugging Face listings, revision replies and GGUF prefixes (stubbed fetch); no network, no wasm.
        run: NOEVIA_CORE_CHECKOUT="$PWD/oracle-core" node crates/model-pull/tests/record_model_pull.cjs --check crates/model-pull/tests/fixtures/node-model-pull.v1.json
