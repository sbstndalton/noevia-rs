name: Full native feature catalog
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# A newer push to a pull request cancels its superseded run. Push runs (main only) share one group per
# workflow without cancelling: the running main check always finishes (and saves the cache), and a newer
# merge replaces any main run still waiting, so main is checked at its latest head and no minutes are spent
# on superseded merges.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # tools/ci/changed_areas.py: on a pull request that only changes leaf crates nobody depends on
  # or names (and docs), the jobs below are skipped (a skipped job satisfies a required check);
  # anything else runs them all, and so does a detect job that failed.
  changes:
    uses: ./.github/workflows/changed-areas.yml
  feature-catalog:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.full != 'false') }}
    name: Selected-core full catalog and native consumers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: sbstndalton/noevia-core
          ref: 21c65f2039632a77a3827533429ff87c4a936f7b
          path: selected-core
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - uses: dtolnay/rust-toolchain@70dec6087f2cb6bab9fbac4da23160afbe848e91
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          # Only main saves caches: pull-request caches are scoped to their PR and evicted main's (10 GB repo cap).
          save-if: ${{ github.event_name == 'push' }}
      - run: python3 tools/features/generate_catalog.py --check
      - run: node tools/features/check_core_catalog.cjs "$PWD/selected-core"
      - name: Actual selected-core feature service reproduces committed oracle
        run: node crates/server-features/tests/oracle.cjs "$PWD/selected-core" | cmp -s - crates/server-features/tests/fixtures/core-feature-eval-v2.json
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked -p server-features -p server-auth -p server-routing-mode -p server-chatgpt-status --all-targets -- -D warnings
      - run: cargo test --locked -p server-features -p server-auth -p server-routing-mode -p server-chatgpt-status
