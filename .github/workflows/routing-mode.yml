name: Native routing configuration
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  routing-native:
    name: Required native routing configuration contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install explicit qualification toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component clippy --component rustfmt --target wasm32-unknown-unknown
      - name: Read actual merged core pin
        id: core
        run: |
          set -euo pipefail
          ref=$(tr -d ' \n' < contracts/http/core.ref)
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: sbstndalton/noevia-core
          ref: ${{ steps.core.outputs.sha }}
          path: core
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - run: npm ci --no-fund --no-audit
        working-directory: core/server
      - uses: dtolnay/rust-toolchain@70dec6087f2cb6bab9fbac4da23160afbe848e91
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Build checksum-pinned actual-core WASM
        run: |
          set -euo pipefail
          eval "$(grep -E '^(NOEVIA_RS_REF|NOEVIA_RS_SHA256|DAV_PARSE_WASM_SHA256)=[0-9a-f]+$' core/server/dav-parse.lock)"
          [[ "$NOEVIA_RS_REF" =~ ^[0-9a-f]{40}$ ]]
          curl -fsSL "https://codeload.github.com/sbstndalton/noevia-rs/tar.gz/$NOEVIA_RS_REF" -o "$RUNNER_TEMP/routing-wasm.tgz"
          echo "$NOEVIA_RS_SHA256  $RUNNER_TEMP/routing-wasm.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/routing-wasm"
          tar -xzf "$RUNNER_TEMP/routing-wasm.tgz" --strip-components=1 -C "$RUNNER_TEMP/routing-wasm"
          "$RUNNER_TEMP/routing-wasm/tools/build-dav-parse-wasm.sh" "$GITHUB_WORKSPACE/core/server/wasm/dav-parse.wasm"
          echo "$DAV_PARSE_WASM_SHA256  core/server/wasm/dav-parse.wasm" | sha256sum -c -
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked -p server-routing-mode -p noevia-server -p replay --all-targets --features rust-routing-mode -- -D warnings
      - name: Bounded process and exact mutation classification controls
        run: |
          cargo run --locked -q -p server-routing-mode --example process_controls
          cargo test --locked -p server-routing-mode --example process_controls
          cargo test --locked -p replay --bin corpus-launcher capture_tests
      - name: Actual source oracle, property comparisons and wrong provenance refusal
        env:
          NODE_PATH: ${{ github.workspace }}/core/server/node_modules
          NOEVIA_ROUTING_ORACLE_CORE: ${{ github.workspace }}/core
        run: |
          set -euo pipefail
          cargo run --locked -q -p server-routing-mode --example node_oracle -- "$PWD/core" "$RUNNER_TEMP/node-routing.json" crates/server-routing-mode/tests/fixtures/node-routing.v1.json
          cargo test --locked -p server-routing-mode -- --nocapture
          if NOEVIA_ROUTING_CORE_SHA=0000000000000000000000000000000000000000 cargo run --locked -q -p server-routing-mode --example node_oracle -- "$PWD/core" "$RUNNER_TEMP/wrong-routing.json" > "$RUNNER_TEMP/wrong-source.log" 2>&1; then exit 1; fi
          grep -q 'source' "$RUNNER_TEMP/wrong-source.log"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: sbstndalton/noevia-core
          ref: 010735c7d86d30269ab3f4a351b2135faea1c8e7
          path: m6-worker-core
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - name: Fresh immutable auth/device factory prerequisite (#1373)
        run: |
          set -euo pipefail
          umask 077
          evidence="$RUNNER_TEMP/m6-worker-build"
          source="$RUNNER_TEMP/m6-worker-source"
          npm_root="$RUNNER_TEMP/m6-worker-npm"
          core="$GITHUB_WORKSPACE/m6-worker-core"
          mkdir -m 700 "$evidence" "$npm_root"
          run_capture() {
            local label="$1" rc=0
            shift
            printf '%s\n' "$@" > "$evidence/$label.argv"
            "$@" > "$evidence/$label.stdout" 2> "$evidence/$label.stderr" || rc=$?
            printf '%s\n' "$rc" > "$evidence/$label.status"
            return "$rc"
          }
          head="$(git rev-parse HEAD)"
          tree="$(git rev-parse 'HEAD^{tree}')"
          run_capture source-checkout git worktree add --detach "$source" "$head"
          [[ "$(git -C "$source" rev-parse HEAD)" == "$head" ]]
          [[ "$(git -C "$source" rev-parse 'HEAD^{tree}')" == "$tree" ]]
          [[ -z "$(git -C "$source" status --porcelain --untracked-files=all)" ]]
          [[ "$(git -C "$core" rev-parse HEAD)" == 010735c7d86d30269ab3f4a351b2135faea1c8e7 ]]
          [[ "$(git -C "$core" rev-parse 'HEAD^{tree}')" == 345adfa12da083eb5888ec232dc2d86b9b0383a5 ]]
          [[ -z "$(git -C "$core" status --porcelain --untracked-files=all)" ]]
          git -C "$core" show HEAD:server/package.json > "$npm_root/package.json"
          git -C "$core" show HEAD:server/package-lock.json > "$npm_root/package-lock.json"
          echo "f3f9375884302c7dcdd7fb510b7804f5dadcdced8ccabdc827638378353db19c  $npm_root/package.json" | sha256sum -c -
          echo "ad078a36d1f9b72ba7ffeb2fa945deca872ea81742c8fe1ed5c9323ddcf497e9  $npm_root/package-lock.json" | sha256sum -c -
          run_capture npm npm ci --prefix "$npm_root" --no-fund --no-audit
          run_capture rust-version rustc -vV
          grep -qx 'release: 1.99.0' "$evidence/rust-version.stdout"
          cd "$source"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/m6-worker-target"
          export NOEVIA_WORKER_AUTH_JOB="${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:${GITHUB_JOB}"
          export NOEVIA_WORKER_AUTH_SOURCE_HEAD="$head"
          export NOEVIA_WORKER_AUTH_SOURCE_TREE="$tree"
          export NOEVIA_WORKER_AUTH_REFERENCE_ROOT="$RUNNER_TEMP/m6-worker-auth"
          export NOEVIA_WORKER_AUTH_REFERENCE="$NOEVIA_WORKER_AUTH_REFERENCE_ROOT/worker-binding.json"
          printf '%s\n' "NOEVIA_WORKER_AUTH_JOB=$NOEVIA_WORKER_AUTH_JOB" "NOEVIA_WORKER_AUTH_SOURCE_HEAD=$head" "NOEVIA_WORKER_AUTH_SOURCE_TREE=$tree" "NOEVIA_WORKER_AUTH_REFERENCE_ROOT=$NOEVIA_WORKER_AUTH_REFERENCE_ROOT" "NOEVIA_WORKER_AUTH_REFERENCE=$NOEVIA_WORKER_AUTH_REFERENCE" >> "$GITHUB_ENV"
          run_capture tool-build cargo build --locked -p replay --bin chatgpt-status-contracts --message-format=json
          tool="$CARGO_TARGET_DIR/debug/chatgpt-status-contracts"
          run_capture tool-selection "$tool" select-cargo-artifact tool "$evidence/tool-build.stdout"
          [[ "$(cat "$evidence/tool-selection.stdout")" == "$tool" ]]
          node_path="$(realpath "$(command -v node)")"
          sha256sum "$tool" "$node_path" > "$evidence/executables.sha256"
          run_capture inventory "$tool" inventory-linux-dependencies --installed-root "$npm_root" --core-checkout "$core" --owned-output "$RUNNER_TEMP/m6-worker-dependencies"
          run_capture capture "$tool" capture-linux-worker-auth --core-checkout "$core" --dependency-root "$RUNNER_TEMP/m6-worker-dependencies/dependencies" --dependency-inventory "$RUNNER_TEMP/m6-worker-dependencies/dependency-inventory.json" --node "$node_path" --source-checkout "$source" --owned-output "$NOEVIA_WORKER_AUTH_REFERENCE_ROOT"
          run_capture verification "$tool" verify-linux-worker-auth --reference-binding "$NOEVIA_WORKER_AUTH_REFERENCE"
          sha256sum -c "$evidence/executables.sha256"
          [[ -z "$(git status --porcelain --untracked-files=all)" ]]
      - name: Compile closed Rust resolver fixture before server tests (#1373)
        run: |
          set -euo pipefail
          umask 077
          evidence="$RUNNER_TEMP/m6-resolver-fixture"
          fixture=/tmp/m6-resolver-fixture-v1
          test ! -e "$evidence" && test ! -L "$evidence"
          test ! -e "$fixture" && test ! -L "$fixture"
          mkdir -m 700 "$evidence"
          git rev-parse HEAD 'HEAD^{tree}' > "$evidence/source.identity"
          sha256sum bins/noevia-server/tests/support/resolver_fixture.rs > "$evidence/source.sha256"
          compiler="$(rustup which rustc)"
          sha256sum "$compiler" > "$evidence/compiler.sha256"
          "$compiler" -vV > "$evidence/compiler.version"
          grep -qx 'release: 1.99.0' "$evidence/compiler.version"
          printf '%s\n' "$compiler" --edition=2024 bins/noevia-server/tests/support/resolver_fixture.rs -o "$fixture" > "$evidence/command.txt"
          set +e
          "$compiler" --edition=2024 bins/noevia-server/tests/support/resolver_fixture.rs -o "$fixture" > "$evidence/build.stdout" 2> "$evidence/build.stderr"
          code=$?
          set -e
          printf '%s\n' "$code" > "$evidence/build.status"
          test "$code" = 0
          sha256sum -c "$evidence/source.sha256"
          test -f "$fixture" && test ! -L "$fixture"
          chmod 700 "$fixture"
          sha256sum "$fixture" > "$evidence/binary.sha256"
      - name: Real HTTP auth, CSRF, device actor, bounded body, filesystem and partial audit state
        run: cargo test --locked -p noevia-server --features rust-routing-mode
      - name: Production mutations require semantic test failures
        run: cargo run --locked -q -p server-routing-mode --example mutants -- "$RUNNER_TEMP/routing-mutants"
      - name: Compiled capability and isolated featureless startup refusal
        run: |
          set -euo pipefail
          cargo build --locked --target-dir target/routing-featureless -p noevia-server --no-default-features
          if target/routing-featureless/debug/noevia-server --features | grep -qx rust-routing-mode; then exit 1; fi
          if NOEVIA_LEGACY_UPSTREAM=http://127.0.0.1:9 NOEVIA_RUST_AUTH=1 NOEVIA_RUST_ROUTING_MODE=1 target/routing-featureless/debug/noevia-server > "$RUNNER_TEMP/routing-featureless.log" 2>&1; then exit 1; fi
          grep -q 'needs compiled rust-routing-mode' "$RUNNER_TEMP/routing-featureless.log"
          cargo build --locked -p replay -p noevia-server --features rust-routing-mode
          target/debug/noevia-server --features | grep -qx rust-routing-mode
      - name: Full retained corpus, new routing corpus, exact persisted state and valid identity omission
        run: target/debug/routing-contracts "$PWD/core" "$RUNNER_TEMP/routing-contracts"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-routing-contracts
          path: |
            ${{ runner.temp }}/m6-worker-build
            ${{ runner.temp }}/m6-worker-dependencies
            ${{ runner.temp }}/m6-worker-auth
            ${{ runner.temp }}/m6-resolver-fixture
            ${{ runner.temp }}/node-routing.json
            ${{ runner.temp }}/wrong-source.log
            ${{ runner.temp }}/routing-featureless.log
            ${{ runner.temp }}/routing-mutants
            ${{ runner.temp }}/routing-contracts
          if-no-files-found: error
