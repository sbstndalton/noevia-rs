name: Native routing default GET
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  routing-default-native:
    name: Required native routing default contracts (#1305)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Read actual merged core pin
        id: core
        run: |
          set -euo pipefail
          ref=$(tr -d ' \n' < contracts/http/core.ref)
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: sbstndalton/noevia-core
          ref: ${{ steps.core.outputs.sha }}
          path: core
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - uses: dtolnay/rust-toolchain@70dec6087f2cb6bab9fbac4da23160afbe848e91
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked -p server-routing-default -p noevia-server --all-targets --features rust-routing-default -- -D warnings
      - name: Actual core workspace oracle reproduces the committed corpus
        run: |
          set -euo pipefail
          node crates/server-routing-default/tests/oracle.cjs "$PWD/core" "$RUNNER_TEMP/node-routing-default.json"
          cmp "$RUNNER_TEMP/node-routing-default.json" crates/server-routing-default/tests/fixtures/node-routing-default.v1.json
      - name: Bounded reader, policy properties and Node corpus replay
        run: cargo test --locked -p server-routing-default
      - name: Real HTTP identity, tenant, method and fail-closed read through the front
        run: cargo test --locked -p noevia-server --features rust-routing-default
      - name: Compiled capability and isolated featureless startup refusal
        run: |
          set -euo pipefail
          cargo build --locked --target-dir target/routing-default-featureless -p noevia-server --no-default-features
          if target/routing-default-featureless/debug/noevia-server --features | grep -qx rust-routing-default; then exit 1; fi
          if NOEVIA_LEGACY_UPSTREAM=http://127.0.0.1:9 NOEVIA_RUST_AUTH=1 NOEVIA_RUST_ROUTING_DEFAULT=1 target/routing-default-featureless/debug/noevia-server > "$RUNNER_TEMP/routing-default-featureless.log" 2>&1; then exit 1; fi
          grep -q 'needs compiled rust-routing-default' "$RUNNER_TEMP/routing-default-featureless.log"
          cargo build --locked -p noevia-server --features rust-routing-default
          target/debug/noevia-server --features | grep -qx rust-routing-default
