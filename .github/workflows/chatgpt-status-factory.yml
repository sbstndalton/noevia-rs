name: Native ChatGPT status factory qualification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  factory-linux:
    name: Native ChatGPT status finite factory and Rust router
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
    defaults:
      run:
        shell: bash
        working-directory: rs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: rs
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: sbstndalton/noevia-core
          ref: 010735c7d86d30269ab3f4a351b2135faea1c8e7
          path: oracle-core
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - uses: dtolnay/rust-toolchain@70dec6087f2cb6bab9fbac4da23160afbe848e91
        with:
          toolchain: 1.99.0
          components: clippy, rustfmt
      - name: Install explicit qualification toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component clippy --component rustfmt --target wasm32-unknown-unknown
      - name: Prepare exact locked factory dependencies outside source
        run: |
          set -euo pipefail
          umask 077
          evidence="$RUNNER_TEMP/m6-build-evidence"
          run_capture() {
            local label="$1" rc=0
            shift
            printf '%s\n' "$@" > "$evidence/$label.argv"
            : > "$evidence/$label.stdout"
            : > "$evidence/$label.stderr"
            : > "$evidence/$label.status"
            "$@" > "$evidence/$label.stdout" 2> "$evidence/$label.stderr" || rc=$?
            printf '%s\n' "$rc" > "$evidence/$label.status"
            return "$rc"
          }
          npm_root="$RUNNER_TEMP/m6-npm"
          mkdir "$evidence" "$npm_root"
          core="$GITHUB_WORKSPACE/oracle-core"
          [[ "$(git -C "$core" rev-parse HEAD)" == 010735c7d86d30269ab3f4a351b2135faea1c8e7 ]]
          [[ "$(git -C "$core" rev-parse 'HEAD^{tree}')" == 345adfa12da083eb5888ec232dc2d86b9b0383a5 ]]
          [[ -z "$(git -C "$core" status --porcelain)" ]]
          git -C "$core" show HEAD:server/package.json > "$npm_root/package.json"
          git -C "$core" show HEAD:server/package-lock.json > "$npm_root/package-lock.json"
          echo "f3f9375884302c7dcdd7fb510b7804f5dadcdced8ccabdc827638378353db19c  $npm_root/package.json" | sha256sum -c -
          echo "ad078a36d1f9b72ba7ffeb2fa945deca872ea81742c8fe1ed5c9323ddcf497e9  $npm_root/package-lock.json" | sha256sum -c -
          run_capture npm npm ci --prefix "$npm_root" --no-fund --no-audit
          rustc --version --verbose > "$evidence/rustc.txt"
          grep -qx 'release: 1.99.0' "$evidence/rustc.txt"
          uname -a > "$evidence/kernel.txt"
          run_capture fetch cargo fetch --locked
      - name: Compile scoped tool and actual library test artifact
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/m6-target
        run: |
          set -euo pipefail
          umask 077
          evidence="$RUNNER_TEMP/m6-build-evidence"
          run_capture() {
            local label="$1" rc=0
            shift
            printf '%s\n' "$@" > "$evidence/$label.argv"
            : > "$evidence/$label.stdout"
            : > "$evidence/$label.stderr"
            : > "$evidence/$label.status"
            "$@" > "$evidence/$label.stdout" 2> "$evidence/$label.stderr" || rc=$?
            printf '%s\n' "$rc" > "$evidence/$label.status"
            return "$rc"
          }
          test ! -e "$CARGO_TARGET_DIR" && test ! -L "$CARGO_TARGET_DIR"
          mkdir -m 700 "$CARGO_TARGET_DIR"
          run_capture tool-build cargo build --offline --locked -p replay --bin chatgpt-status-contracts --message-format=json
          run_capture lib-build cargo test --offline --locked -p noevia-server --no-default-features --features rust-chatgpt-status --lib --no-run --message-format=json
          run_capture lib-clippy cargo clippy --offline --locked -p noevia-server --no-default-features --features rust-chatgpt-status --lib --profile test --message-format=json -- -D warnings
          run_capture tool-clippy cargo clippy --offline --locked -p replay --bin chatgpt-status-contracts --profile test --message-format=json -- -D warnings
          run_capture fmt rustfmt --edition 2021 --config skip_children=true --check tools/replay/src/bin/chatgpt-status-contracts.rs tools/replay/src/bin/support/chatgpt_status_linux_ci.rs tools/replay/src/bin/support/chatgpt_status_artifact_staging.rs tools/replay/src/bin/support/chatgpt_worker_auth_oracle.rs tools/replay/src/bin/support/chatgpt_status_dependencies.rs bins/noevia-server/src/support/chatgpt_status_differential.rs
      - name: One fresh Linux factory capture, negative control, then seven Rust rows
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/m6-target
        run: |
          set -euo pipefail
          umask 077
          evidence="$RUNNER_TEMP/m6-build-evidence"
          run_capture() {
            local label="$1" rc=0
            shift
            printf '%s\n' "$@" > "$evidence/$label.argv"
            : > "$evidence/$label.stdout"
            : > "$evidence/$label.stderr"
            : > "$evidence/$label.status"
            "$@" > "$evidence/$label.stdout" 2> "$evidence/$label.stderr" || rc=$?
            printf '%s\n' "$rc" > "$evidence/$label.status"
            return "$rc"
          }
          tool="$CARGO_TARGET_DIR/debug/chatgpt-status-contracts"
          run_capture tool-selection "$tool" select-cargo-artifact tool "$evidence/tool-build.stdout"
          run_capture lib-selection "$tool" select-cargo-artifact library-test "$evidence/lib-build.stdout"
          [[ "$(cat "$evidence/tool-selection.stdout")" == "$tool" ]]
          core="$GITHUB_WORKSPACE/oracle-core"
          original_tool="$(cat "$evidence/tool-selection.stdout")"
          export NOEVIA_WORKER_AUTH_JOB="${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:${GITHUB_JOB}"
          export NOEVIA_WORKER_AUTH_SOURCE_HEAD="$(git rev-parse HEAD)"
          export NOEVIA_WORKER_AUTH_SOURCE_TREE="$(git rev-parse 'HEAD^{tree}')"
          export NOEVIA_WORKER_AUTH_SOURCE_ROOT="$PWD"
          staging_root="$RUNNER_TEMP/m6-factory-coordinator"
          run_capture staging "$original_tool" stage-cargo-coordinator --cargo-json "$evidence/tool-build.stdout" --cargo-output "$CARGO_TARGET_DIR" --source-checkout "$PWD" --owned-output "$staging_root"
          staging_manifest="$staging_root/coordinator-staging.json"
          [[ "$(cat "$evidence/staging.stdout")" == "$staging_manifest" ]]
          tool="$staging_root/coordinator"
          node_path="$(realpath "$(command -v node)")"
          run_capture inventory "$tool" inventory-linux-dependencies --installed-root "$RUNNER_TEMP/m6-npm" --core-checkout "$core" --owned-output "$RUNNER_TEMP/m6-linux-dependencies"
          run_capture qualification "$tool" qualify-linux-factory --core-checkout "$core" --dependency-root "$RUNNER_TEMP/m6-linux-dependencies/dependencies" --dependency-inventory "$RUNNER_TEMP/m6-linux-dependencies/dependency-inventory.json" --node "$node_path" --lib-test "$(cat "$evidence/lib-selection.stdout")" --artifact-staging "$staging_manifest" --source-checkout "$PWD" --owned-output "$RUNNER_TEMP/m6-linux-factory"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-chatgpt-status-finite-factory
          path: |
            ${{ runner.temp }}/m6-build-evidence
            ${{ runner.temp }}/m6-factory-coordinator
            ${{ runner.temp }}/m6-linux-dependencies
            ${{ runner.temp }}/m6-linux-factory
          if-no-files-found: error
