name: Native conversation export GET
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  export-native:
    name: Required native conversation export contracts (#1315)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Read actual merged core pin
        id: core
        run: |
          set -euo pipefail
          ref=$(tr -d ' \n' < contracts/http/core.ref)
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: sbstndalton/noevia-core
          ref: ${{ steps.core.outputs.sha }}
          path: core
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - uses: dtolnay/rust-toolchain@70dec6087f2cb6bab9fbac4da23160afbe848e91
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked -p server-export -p noevia-server --all-targets --features noevia-server/rust-export,noevia-server/rust-free-chats -- -D warnings
      - name: Actual core route oracle reproduces the committed corpus
        # core's own workspace store (M4 switches on, flock from util-linux), readHistory, export
        # route and http.cjs over synthetic tenants on disk.
        run: |
          set -euo pipefail
          node crates/server-export/tests/route-oracle.cjs "$PWD/core" "$RUNNER_TEMP/node-export-route.json"
          cmp "$RUNNER_TEMP/node-export-route.json" crates/server-export/tests/fixtures/node-export-route.v1.json
      - name: Node-differential export, tenant isolation and read bounds
        run: NOEVIA_EXPORT_ROUTE_FIXTURE="$RUNNER_TEMP/node-export-route.json" cargo test --locked -p server-export
      - name: Real HTTP gate, audit, headers, 413 and switch through the front
        run: |
          set -euo pipefail
          cargo test --locked -p noevia-server --features rust-export,rust-free-chats
          cargo test --locked -p noevia-server --features rust-export,rust-free-chats,rust-project-chats,rust-stats,rust-routing-default
      - name: Compiled capability and startup refusals
        run: |
          set -euo pipefail
          cargo build --locked --target-dir target/export-featureless -p noevia-server --no-default-features
          if target/export-featureless/debug/noevia-server --features | grep -qx rust-export; then exit 1; fi
          if NOEVIA_LEGACY_UPSTREAM=http://127.0.0.1:9 UI_DATA_DIR=/tmp NOEVIA_RUST_AUTH=1 NOEVIA_RUST_PROJECTS=1 NOEVIA_RUST_EXPORT=1 target/export-featureless/debug/noevia-server > "$RUNNER_TEMP/export-featureless.log" 2>&1; then exit 1; fi
          grep -q 'needs compiled rust-export' "$RUNNER_TEMP/export-featureless.log"
          cargo build --locked -p replay -p noevia-server --features noevia-server/rust-export,noevia-server/rust-free-chats,noevia-server/rust-project-chats
          target/debug/noevia-server --features | grep -qx rust-export
          # Without the M4 projects switch the export switch is a startup refusal.
          if NOEVIA_LEGACY_UPSTREAM=http://127.0.0.1:9 UI_DATA_DIR=/tmp NOEVIA_RUST_AUTH=1 NOEVIA_RUST_EXPORT=1 target/debug/noevia-server > "$RUNNER_TEMP/export-noprojects.log" 2>&1; then exit 1; fi
          grep -q 'NOEVIA_RUST_EXPORT=1 needs NOEVIA_RUST_PROJECTS=1' "$RUNNER_TEMP/export-noprojects.log"
      - run: npm ci --no-fund --no-audit
        working-directory: core/server
      - name: Build dav-parse.wasm at core's pinned noevia-rs ref
        working-directory: core
        run: |
          set -euo pipefail
          eval "$(grep -E '^(NOEVIA_RS_REF|NOEVIA_RS_SHA256|DAV_PARSE_WASM_SHA256)=[0-9a-f]+$' server/dav-parse.lock)"
          [[ "$NOEVIA_RS_REF" =~ ^[0-9a-f]{40}$ ]]
          curl -fsSL "https://codeload.github.com/sbstndalton/noevia-rs/tar.gz/$NOEVIA_RS_REF" -o "$RUNNER_TEMP/rs.tgz"
          echo "$NOEVIA_RS_SHA256  $RUNNER_TEMP/rs.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/rs-pin" && tar -xzf "$RUNNER_TEMP/rs.tgz" --strip-components=1 -C "$RUNNER_TEMP/rs-pin"
          "$RUNNER_TEMP/rs-pin/tools/build-dav-parse-wasm.sh" "$PWD/server/wasm/dav-parse.wasm"
          echo "$DAV_PARSE_WASM_SHA256  server/wasm/dav-parse.wasm" | sha256sum -c -
      - name: Replay against Node directly (reference data dir)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/seed"
          target/debug/replay run --corpus contracts/http/corpus --base http://127.0.0.1:18021 \
            --ignore-body hours --ignore-body peakHour/hour \
            --seed "$RUNNER_TEMP/seed" --work "$RUNNER_TEMP/work-node" \
            --server-cmd "exec '$GITHUB_WORKSPACE/target/debug/corpus-launcher' serve '$GITHUB_WORKSPACE/core'" \
            --state-out "$RUNNER_TEMP/node-state.json"
      - name: Full replay through the front with NOEVIA_RUST_AUTH=1 NOEVIA_RUST_PROJECTS=1 NOEVIA_RUST_EXPORT=1
        run: |
          set -euo pipefail
          target/debug/replay run --corpus contracts/http/corpus --base http://127.0.0.1:18021 \
            --ignore-body hours --ignore-body peakHour/hour \
            --seed "$RUNNER_TEMP/seed" --work "$RUNNER_TEMP/work-export" \
            --server-cmd "exec env NOEVIA_RUST_AUTH=1 NOEVIA_RUST_PROJECTS=1 NOEVIA_RUST_EXPORT=1 sh '$GITHUB_WORKSPACE/tools/front/replay-front.sh' '$GITHUB_WORKSPACE/core' '$GITHUB_WORKSPACE/target/debug/noevia-server'" \
            --report "$RUNNER_TEMP/export-positive.json" --expect-state "$RUNNER_TEMP/node-state.json"
      - name: "Negative control: a confirmed Node refuses the export the front no longer answers"
        # Meaningful once the pinned core refuses a confirmed export (noevia-core exportRustOwned);
        # skipped, and said so, while core.ref predates it.
        run: |
          set -uo pipefail
          if ! grep -q exportRustOwned core/server/routes/export.cjs; then
            echo "::notice::core.ref has no exportRustOwned yet: negative control skipped"; exit 0
          fi
          if target/debug/replay run --corpus contracts/http/corpus --base http://127.0.0.1:18021 \
              --ignore-body hours --ignore-body peakHour/hour \
              --seed "$RUNNER_TEMP/seed" --work "$RUNNER_TEMP/work-control" \
              --server-cmd "exec env NOEVIA_RUST_AUTH=1 NOEVIA_RUST_PROJECTS=1 NOEVIA_RUST_EXPORT=1 REPLAY_FRONT_CONTROL_NODE_ONLY_EXPORT=1 sh '$GITHUB_WORKSPACE/tools/front/replay-front.sh' '$GITHUB_WORKSPACE/core' '$GITHUB_WORKSPACE/target/debug/noevia-server'" \
              --report "$RUNNER_TEMP/export-control.json"; then
            echo "::error::Node answered the export although the front was confirmed to own it"; exit 1
          fi
          python3 - "$RUNNER_TEMP/export-control.json" <<'PY'
          import json, sys
          rows = json.load(open(sys.argv[1]))
          bad = [r for r in rows if r['diffs'] or r['error'] or r['status'] != r['expectedStatus']]
          assert bad and all(r['method'] == 'GET' and r['path'] == '/api/export/conversations' and r['status'] == 503 for r in bad), [(r['method'], r['path'], r['status']) for r in bad]
          print('only GET /api/export/conversations differs (Node refused it):', len(bad))
          PY
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-export-evidence
          path: |
            ${{ runner.temp }}/node-export-route.json
            ${{ runner.temp }}/export-positive.json
            ${{ runner.temp }}/export-control.json
            ${{ runner.temp }}/node-state.json
          if-no-files-found: ignore
