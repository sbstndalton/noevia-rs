name: Native chat search and download GET
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# A newer push to a pull request cancels its superseded run. Push runs (main only) share one group per
# workflow without cancelling: the running main check always finishes (and saves the cache), and a newer
# merge replaces any main run still waiting, so main is checked at its latest head and no minutes are spent
# on superseded merges.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # tools/ci/changed_areas.py: on a pull request that only changes leaf crates nobody depends on
  # or names (and docs), the jobs below are skipped (a skipped job satisfies a required check);
  # anything else runs them all, and so does a detect job that failed.
  changes:
    uses: ./.github/workflows/changed-areas.yml
  chat-lists-native:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.full != 'false') }}
    name: Required native chat search and download contracts (#1450, #1471)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Read the oracle's core pin
        # The last core whose routes/chat-lists.cjs answers both routes (later cores refuse them).
        id: core
        run: |
          set -euo pipefail
          ref=$(tr -d ' \n' < bins/noevia-server/tests/fixtures/chat-lists-oracle.core-ref)
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: sbstndalton/noevia-core
          ref: ${{ steps.core.outputs.sha }}
          path: core
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - uses: dtolnay/rust-toolchain@70dec6087f2cb6bab9fbac4da23160afbe848e91
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          # Only main saves caches: pull-request caches are scoped to their PR and evicted main's (10 GB repo cap).
          save-if: ${{ github.event_name == 'push' }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked -p server-projects -p server-export -p noevia-server --all-targets -- -D warnings
      - name: Actual core route oracle reproduces the committed cases
        # core's own workspace load, readHistory, routes/chat-lists.cjs and http.cjs over synthetic
        # tenants on disk.
        run: |
          set -euo pipefail
          node bins/noevia-server/tests/chat-lists-oracle.cjs "$PWD/core" "$RUNNER_TEMP/node-chat-lists.json"
          cmp "$RUNNER_TEMP/node-chat-lists.json" bins/noevia-server/tests/fixtures/node-chat-lists.v1.json
      - name: Node's Date answers reproduce the committed corpus, and the port gives each one
        env:
          TZ: UTC
        run: |
          set -euo pipefail
          node crates/server-export/tests/js-date-oracle.cjs "$RUNNER_TEMP/node-dates.json"
          cmp "$RUNNER_TEMP/node-dates.json" crates/server-export/tests/fixtures/node-dates.v1.json
          cargo test --locked -p server-export --test js_date
      - name: Node-differential search and download through the front, tenant isolation, methods
        env:
          TZ: UTC
        run: NOEVIA_CHAT_LISTS_FIXTURE="$RUNNER_TEMP/node-chat-lists.json" cargo test --locked -p noevia-server --test chat_lists_read
      - name: The same date corpora in a non-UTC zone (zone-less dates are local time, as in Node)
        env:
          TZ: America/New_York
          ORACLE_TZ: America/New_York
        run: |
          set -euo pipefail
          node crates/server-export/tests/js-date-oracle.cjs "$RUNNER_TEMP/node-dates-ny.json"
          NOEVIA_DATES_FIXTURE="$RUNNER_TEMP/node-dates-ny.json" cargo test --locked -p server-export --test js_date
          node bins/noevia-server/tests/chat-lists-oracle.cjs "$PWD/core" "$RUNNER_TEMP/node-chat-lists-ny.json"
          NOEVIA_CHAT_LISTS_FIXTURE="$RUNNER_TEMP/node-chat-lists-ny.json" cargo test --locked -p noevia-server --test chat_lists_read
      - name: The date corpus east of UTC, with each zone's own DST change days (#2344)
        run: |
          set -euo pipefail
          for zone in Europe/Berlin Australia/Lord_Howe; do
            out="$RUNNER_TEMP/node-dates-$(basename "$zone").json"
            TZ="$zone" ORACLE_TZ="$zone" node crates/server-export/tests/js-date-oracle.cjs "$out"
            TZ="$zone" NOEVIA_DATES_FIXTURE="$out" cargo test --locked -p server-export --test js_date
          done
      - name: The lookup, the search and the file name
        run: |
          set -euo pipefail
          cargo test --locked -p server-projects --lib chat_download
          cargo test --locked -p server-projects --lib workspace
          cargo test --locked -p server-export --lib single
          TZ=UTC cargo test --locked -p server-export --lib js_date
          cargo test --locked -p server-export --lib markdown
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-chat-lists-evidence
          path: |
            ${{ runner.temp }}/node-chat-lists.json
            ${{ runner.temp }}/node-chat-lists-ny.json
            ${{ runner.temp }}/node-dates-ny.json
            ${{ runner.temp }}/node-dates-Berlin.json
            ${{ runner.temp }}/node-dates-Lord_Howe.json
          if-no-files-found: ignore
