name: Native chat edge
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# A newer push to a pull request cancels its superseded run. Push runs (main only) are keyed by
# commit, so none is ever cancelled or replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # tools/ci/changed_areas.py: on a pull request that only changes leaf crates nobody depends on
  # or names (and docs), the jobs below are skipped (a skipped job satisfies a required check);
  # anything else runs them all.
  changes:
    uses: ./.github/workflows/changed-areas.yml
  chat-edge-native:
    needs: changes
    if: needs.changes.outputs.full != 'false'
    name: Required native chat edge and shared llm budget contracts (chat port S6)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Read the oracle's core pin
        # The last core whose routes/chat.cjs and routes/diary.cjs count the llm: budget (later cores leave it to the front).
        id: core
        run: |
          set -euo pipefail
          ref=$(tr -d ' \n' < bins/noevia-server/tests/fixtures/chat-edge-oracle.core-ref)
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: sbstndalton/noevia-core
          ref: ${{ steps.core.outputs.sha }}
          path: core
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - uses: dtolnay/rust-toolchain@70dec6087f2cb6bab9fbac4da23160afbe848e91
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked -p js-json -p noevia-server --all-targets -- -D warnings
      - name: Actual core route oracle reproduces the committed cases
        # core's own routes/chat.cjs, chat-mode.cjs, routes/diary.cjs and http.cjs; no model runs.
        run: |
          set -euo pipefail
          node bins/noevia-server/tests/chat-edge-oracle.cjs "$PWD/core" "$RUNNER_TEMP/node-chat-edge.json"
          cmp "$RUNNER_TEMP/node-chat-edge.json" bins/noevia-server/tests/fixtures/node-chat-edge.v1.json
      - name: Node-differential edge through the front, gate precedence, shared budget, Cowork relay
        run: |
          set -euo pipefail
          NOEVIA_CHAT_EDGE_FIXTURE="$RUNNER_TEMP/node-chat-edge.json" cargo test --locked -p noevia-server --test chat_edge
          cargo test --locked -p noevia-server --test chat_turn
          cargo test --locked -p noevia-server --test framing_suggest
          cargo test --locked -p noevia-server --lib chat_edge
          cargo test --locked -p noevia-server --lib routes::tests
          cargo test --locked -p js-json --lib raw
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-chat-edge-evidence
          path: ${{ runner.temp }}/node-chat-edge.json
          if-no-files-found: ignore
