name: Native chat framing suggestion and journal activity
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  chat-framing-suggest-native:
    name: Required native framing suggestion and chat activity contracts (chat port S3, S4)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Read the oracle's core pin
        # The last core whose routes/chat-framing.cjs answers the suggestion (later cores refuse its POST).
        id: core
        run: |
          set -euo pipefail
          ref=$(tr -d ' \n' < bins/noevia-server/tests/fixtures/framing-suggest-oracle.core-ref)
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$ref" >> "$GITHUB_OUTPUT"
          front=$(tr -d ' \n' < contracts/http/front-core.ref)
          [[ "$front" =~ ^[0-9a-f]{40}$ ]]
          echo "front=$front" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: sbstndalton/noevia-core
          ref: ${{ steps.core.outputs.sha }}
          path: core
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: sbstndalton/noevia-core
          ref: ${{ steps.core.outputs.front }}
          path: front-core
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - uses: dtolnay/rust-toolchain@70dec6087f2cb6bab9fbac4da23160afbe848e91
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked -p server-auth -p noevia-server --all-targets -- -D warnings
      - name: Actual core route oracle reproduces the committed cases
        # core's own routes/chat-framing.cjs and http.cjs, the decision faked; no model runs.
        run: |
          set -euo pipefail
          node bins/noevia-server/tests/framing-suggest-oracle.cjs "$PWD/core" "$RUNNER_TEMP/node-framing-suggest.json" "$PWD/front-core"
          cmp "$RUNNER_TEMP/node-framing-suggest.json" bins/noevia-server/tests/fixtures/node-framing-suggest.v1.json
      - name: Node-differential suggestion through the front, gate, fail-open, corpus
        run: NOEVIA_FRAMING_SUGGEST_FIXTURE="$RUNNER_TEMP/node-framing-suggest.json" cargo test --locked -p noevia-server --test framing_suggest
      - name: The front records authenticated activity for Node's journal reader
        run: |
          set -euo pipefail
          cargo test --locked -p noevia-server --test chat_activity
          cargo test --locked -p noevia-server --test upkeep
          cargo test --locked -p server-auth --lib upkeep
          cargo test --locked -p noevia-server --lib chat_activity
          cargo test --locked -p noevia-server --lib chat_framing_suggest
          cargo test --locked -p noevia-server --lib routes::tests
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-framing-suggest-evidence
          path: ${{ runner.temp }}/node-framing-suggest.json
          if-no-files-found: ignore
