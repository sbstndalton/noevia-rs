name: Recorded model writes
on:
  push:
    branches: [main]
    paths: ['crates/model-writes/**', '.github/workflows/model-writes.yml']
  pull_request:
    paths: ['crates/model-writes/**', '.github/workflows/model-writes.yml']
permissions:
  contents: read
jobs:
  model-writes-recording:
    name: Model writes recorded from core reproduce
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Read the recording's core pin
        id: oracle
        run: |
          set -euo pipefail
          ref=$(tr -d ' \n' < crates/model-writes/tests/oracle-core.ref)
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: sbstndalton/noevia-core
          ref: ${{ steps.oracle.outputs.sha }}
          path: oracle-core
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - name: The core's own models route lines, inference-budget.cjs and idle-unload-setting.cjs reproduce the committed recording
        # Synthetic QA bodies, settings rows, meminfo texts and model manager answers; no network, no wasm.
        run: NOEVIA_CORE_CHECKOUT="$PWD/oracle-core" node crates/model-writes/tests/record_model_writes.cjs --check crates/model-writes/tests/fixtures/node-model-writes.v1.json
