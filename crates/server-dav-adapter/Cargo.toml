[package]
name = "server-dav-adapter"
version = "0.1.0"
description = "Source-only inbound DAV identity and bounded Diary transport; no production backend or listener"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
server-auth = { path = "../server-auth" }
server-dav = { path = "../server-dav" }
server-store = { path = "../server-store" }
tenant-assertion = { path = "../tenant-assertion" }
base64 = "0.22"
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false }
serde = "1"
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "sync", "time"] }
url = "2.5"
zeroize = { version = "1.9", default-features = false, features = ["alloc"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
