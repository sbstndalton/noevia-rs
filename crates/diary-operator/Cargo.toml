[package]
name = "diary-operator"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
[lints]
workspace = true
[dependencies]
diary-backup-format = { path = "../diary-backup-format" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
[dev-dependencies]
tempfile = "3"
[[bin]]
name = "diary-backup-restore"
path = "src/main.rs"
[[bin]]
name = "diary-config"
path = "src/config_main.rs"
