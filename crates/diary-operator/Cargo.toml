[package]
name = "diary-operator"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
[lints]
workspace = true
[dependencies]
diary-backup-format = { path = "../diary-backup-format" }
yaml-rust2 = { version = "=0.13.0", default-features = false }
regex = "1"
num-bigint-dig = "0.8"
[dev-dependencies]
serde_json = "1"
tempfile = "3"
[[bin]]
name = "diary-backup-restore"
path = "src/main.rs"
[[bin]]
name = "diary-config"
path = "src/config_main.rs"
