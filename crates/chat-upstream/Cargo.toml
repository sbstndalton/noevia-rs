[package]
name = "chat-upstream"
version = "0.1.0"
description = "The provider call path of a native chat turn (noevia-core chat.cjs's upstream address, provider headers, the member-origin check, ssrf.cjs endpointApproved) plus the turn-bound call binding, its per-request re-checks and the response envelope; a leaf crate nothing calls yet"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
js-json = { path = "../js-json" }
# providers.cjs getProvider/providerHeaders and isExternalProvider, already ported there.
engine-facts = { path = "../engine-facts" }
# The native turn's Host trait, which [`host`] implements around the front's.
chat-turn = { path = "../chat-turn" }
# WHATWG URL parsing (origin, userinfo). MIT OR Apache-2.0; already in Cargo.lock.
url = "2"
# The binding's MAC and the key fingerprint. MIT OR Apache-2.0; both already in Cargo.lock.
hmac = "0.12"
sha2 = "0.10"

[dev-dependencies]
proptest = "1"
