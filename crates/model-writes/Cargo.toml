[package]
name = "model-writes"
version = "0.1.0"
description = "The model settings' writes noevia-core still answers, as pure functions (track R11): PUT /api/models/inference-budget (the validation against the host's RAM, the saved row and the answer) and PUT /api/models/idle-unload (the model manager's answers, the held write and its reload, the audit and the answer, over a host the front implements), replayed byte for byte on recorded Node output."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
js-json = { path = "../js-json" }
# The JS string helpers (white space, StringToNumber) the front already builds.
chat-turn = { path = "../chat-turn" }

[dev-dependencies]
serde_json = "1"
