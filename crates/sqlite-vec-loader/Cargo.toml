[package]
name = "sqlite-vec-loader"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
# Same isolation pattern as mem-return: the rest of the workspace stays forbid.
[lints.rust]
unsafe_code = "deny"
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
sqlite-vec = "=0.1.9"
