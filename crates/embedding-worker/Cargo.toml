[package]
name = "embedding-worker"
version = "0.1.0"
description = "Native embedding refresh and migration with paired ownership"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
[lints]
workspace = true
[dependencies]
engine-admission = { path = "../engine-admission" }
model-stream = { path = "../model-stream" }
sqlite-vec-loader = { path = "../sqlite-vec-loader" }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["net", "time", "sync", "rt", "macros"] }
zeroize = "=1.9.1"
rusqlite = { version = "0.40", features = ["bundled"] }
server-store = { path = "../server-store" }
server-projects = { path = "../server-projects" }
ssrf-policy = { path = "../ssrf-policy" }
sha2 = "0.10"
prompt-framing = { path = "../prompt-framing" }
[dev-dependencies]
rustix = { version = "1", features = ["fs", "process"] }
quote = "1"
proc-macro2 = "1"
syn = { version = "2", features = ["full", "visit"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time", "io-util"] }
