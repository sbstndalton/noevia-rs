[package]
name = "synthetic-pdfs"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Synthetic PDF fixtures for the OCR real-engine tests (port of the services ocr/synthetic_pdfs.py)"

[lints]
workspace = true

[[bin]]
name = "synthetic-pdfs"
path = "src/main.rs"

[dependencies]
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
# The OCR worker's own DOCX reader checks the gate's body.docx (tests/ocr_front.rs).
docx-text = { path = "../docx-text" }
tempfile = "3"
