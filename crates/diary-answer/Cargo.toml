[package]
name = "diary-answer"
version = "0.1.0"
description = "Diary answering runtime: exchange deadline and async model client (R9, not yet wired)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
diary-core = { path = "../diary-core" }
diary-retrieval = { path = "../diary-retrieval" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde_json = "1"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync", "macros"] }

[dev-dependencies]
http-body = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "test-util"] }
