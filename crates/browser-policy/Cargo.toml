[package]
name = "browser-policy"
version = "0.1.0"
description = "noevia-core's browser-policy.cjs in Rust: allow, needs approval or blocked for each browser action from the facts the executor observed, where the browser may go, and which secrets may be typed on which origin; the host only ever uses it to ask or refuse more"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
prompt-framing = { path = "../prompt-framing" }
ssrf-policy = { path = "../ssrf-policy" }
url = "2"
icu_normalizer = { version = "2", default-features = false, features = ["compiled_data"] }

[dev-dependencies]
proptest = "1"
