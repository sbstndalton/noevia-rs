[package]
name = "release-assemble"
version = "0.1.0"
description = "Rust slices of noevia's deploy/tools/assemble-release.sh: versions.lock reading, component pin resolution, sha256 checks, a safe tar reader and a deterministic tar.gz writer (inert, nothing calls it yet)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
sha2 = "=0.10.9"

[dev-dependencies]
tempfile = "3"
