[package]
name = "js-json"
version = "0.1.0"
description = "JSON with JavaScript's semantics for ports of Node handlers: JSON.parse into ordered values, JSON.stringify bytes, String(), truthiness"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde = "1"
# float_roundtrip: correctly rounded number parsing, as JSON.parse (the default parser can be one
# ULP off, so a Rust rewrite of a Node file would change stored numbers).
serde_json = { version = "1", features = ["float_roundtrip"] }
sandbox-bridge = { path = "../sandbox-bridge" }
