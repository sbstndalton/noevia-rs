[package]
name = "llamacpp-autoconfig"
version = "0.1.0"
description = "noevia-core's llamacpp-autoconfig.cjs in Rust: KV-cache sizing, the preset suggestion (context, prompt cache, projector and MTP knobs), the Will-it-fit inputs and the load footprint; file and process I/O stay in JS"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
prompt-framing = { path = "../prompt-framing" }
tool-exchange = { path = "../tool-exchange" }

[dev-dependencies]
proptest = "1"
