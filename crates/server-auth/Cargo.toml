[package]
name = "server-auth"
version = "0.1.0"
description = "noevia-core's request authentication (auth.cjs sessions and legacy bearer, device-auth.cjs device tokens, CSRF/origin/browser-only gates, app-password verify) in Rust, read-only plus the gate's per-request session upkeep (M3, NOEVIA_RUST_AUTH), differential-tested against Node"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
server-store = { path = "../server-store" }
secret-envelope = { path = "../secret-envelope" }
policy-leaves = { path = "../policy-leaves" }
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }
sha2 = "0.10"
subtle = "2"
serde_json = "1"
zeroize = { version = "=1.9.1", default-features = false, features = ["alloc"] }

[dev-dependencies]
proptest = "1"
tempfile = "3"
