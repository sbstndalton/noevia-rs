[package]
name = "docling-service"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
[lints]
workspace = true
[dependencies]
serde_json = "1"
nix = { version = "0.30", features = ["signal", "process"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "process", "fs", "io-util"] }
[dev-dependencies]
proptest = "1"
