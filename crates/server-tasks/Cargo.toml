[package]
name = "server-tasks"
version = "0.1.0"
description = "Native task reservations, scoped approvals, and sandbox ACP transport"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
engine-admission = { path = "../engine-admission" }
model-stream = { path = "../model-stream" }
prompt-framing = { path = "../prompt-framing" }
browser-policy = { path = "../browser-policy" }
role-context = { path = "../role-context" }
sha2 = "0.10"
stream-guard = { path = "../stream-guard" }
code-actions = { path = "../code-actions" }
js-json = { path = "../js-json" }
server-projects = { path = "../server-projects" }
server-account = { path = "../server-account" }
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = { version = "=1.9.1", default-features = false, features = ["alloc"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal", "fs"] }

libc = "0.2"

rustix = { version = "=1.1.5", features = ["fs", "process", "param"] }

[dev-dependencies]
tempfile = "3"
