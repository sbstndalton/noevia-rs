[package]
name = "chat-mirror-exec"
version = "0.1.0"
description = "The Diary mirror pass and the per-chat brain build (the work executors behind chat-mirror-sched), ported from noevia-core chat-vault-mirror.cjs, chat-brain.cjs and chat-export.cjs"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
js-json = { path = "../js-json" }
prompt-framing = { path = "../prompt-framing" }
mcp-frame = { path = "../mcp-frame" }
icu_normalizer = { version = "2", default-features = false, features = ["compiled_data"] }
sha2 = "=0.10.9"
rustix = { version = "=1.1.5", features = ["fs"] }
icu_collator = "2"
icu_locale = "2"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
tokio = { version = "1", features = ["time", "rt", "macros"] }
