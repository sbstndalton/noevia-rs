[package]
name = "project-retrieval"
version = "0.1.0"
description = "The project retrieval path of core's rag.cjs in Rust: the read-only vector search over a project index (slot, cosine SQL, score floor, version filter), the #1457 question-naming token rule and the no-index filesContext assembly, checked against recorded Node outputs"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
js-json = { path = "../js-json" }
prompt-framing = { path = "../prompt-framing" }
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json = "1"
sha2 = "0.10"
url = "2"

[dev-dependencies]
sqlite-vec-loader = { path = "../sqlite-vec-loader" }
tempfile = "3"
