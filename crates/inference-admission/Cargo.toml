[package]
name = "inference-admission"
version = "0.1.0"
description = "The one-chat-model admission scheduler of the inference gate (sbstndalton/noevia#2115): pure, deterministic, no I/O."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
form_urlencoded = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

[dev-dependencies]
proptest = "1"
