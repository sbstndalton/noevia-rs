[package]
name = "storage-tools"
version = "0.1.0"
description = "In-app storage file tools over the account's storage connection: reads (list, read, find) and writes (write, create folder, delete), through server-storage-reads; inert (noevia#2759)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
server-storage-reads = { path = "../server-storage-reads" }
js-json = { path = "../js-json" }
storage-path = { path = "../storage-path" }

[dev-dependencies]
zeroize = { version = "=1.9.1", default-features = false, features = ["alloc"] }
