[package]
name = "role-context"
version = "0.1.0"
description = "noevia-core's role-context.cjs in Rust: the per-role context projections of the multi-agent pipeline (allowlists, caps, credential redaction, leak guard); the host only ever uses it to refuse"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
prompt-framing = { path = "../prompt-framing" }
tool-exchange = { path = "../tool-exchange" }
icu_normalizer = { version = "2", default-features = false, features = ["compiled_data"] }
icu_properties = { version = "2", default-features = false, features = ["compiled_data"] }

[dev-dependencies]
proptest = "1"
