[package]
name = "diary-retrieval"
version = "0.1.0"
description = "Diary chunk index: per-model vector slots, incremental re-index and vector search (R9, not yet wired)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
sqlite-vec-loader = { path = "../sqlite-vec-loader" }
diary-corpus-parse = { path = "../diary-corpus-parse" }
serde_json = "1"
sha2 = "=0.10.9"

[dev-dependencies]
tempfile = "3"
