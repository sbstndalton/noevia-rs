[package]
name = "tool-gate"
version = "0.1.0"
description = "noevia-core's tool-gate.cjs rules in Rust: whether one message makes the chat loop prefetch or require a read-only tool, what the decision service is shown and how its answer is read; the host only ever uses it to force less"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
prompt-framing = { path = "../prompt-framing" }
ssrf-policy = { path = "../ssrf-policy" }
url = "2"

[dev-dependencies]
proptest = "1"
