[package]
name = "diary-core"
version = "0.1.0"
description = "Pure Diary core helpers: token estimate, retrieval trace and follow-up resolver (R9, not yet wired)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde_json = "1"
diary-entity-focus = { path = "../diary-entity-focus" }
diary-temporal-focus = { path = "../diary-temporal-focus" }
diary-score-gap = { path = "../diary-score-gap" }
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }

[dev-dependencies]
sha2 = "0.10"
