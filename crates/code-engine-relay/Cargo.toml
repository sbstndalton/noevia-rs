[package]
name = "code-engine-relay"
version = "0.1.0"
description = "Core's Code engine relay (code-machine.cjs, noevia#1853/#1876) in Rust: when the Code role runs on an inference machine, the sandbox reaches that machine only through this relay, with a per-run token, two paths (the model list and chat completions) and the task's model forced. The lease authority, the request handler with Node's answers, the bind-address rules and the environment reading; the HTTP listener and the machine client are the caller's (traits). Inert: nothing uses it yet."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
js-json = { path = "../js-json" }
# Already in Cargo.lock (egress-proxy, embedding-worker, many): the token's randomness, its base64url
# text and the SHA-256 the lease map is keyed by. MIT OR Apache-2.0.
getrandom = "0.3.4"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["sync", "time", "macros"] }
tokio-util = "0.7"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
