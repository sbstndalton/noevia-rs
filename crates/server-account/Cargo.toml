[package]
name = "server-account"
version = "0.1.0"
description = "noevia-core's sign-in and account routes (auth.cjs, device-auth.cjs, app-passwords.cjs, account-*.cjs) in Rust, writing the tables Rust owns under NOEVIA_RUST_AUTH"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
server-store = { path = "../server-store" }
server-auth = { path = "../server-auth" }
passkey = { path = "../passkey" }
js-json = { path = "../js-json" }
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }
rand_core = { version = "0.6", features = ["getrandom"] }
hmac = "0.12"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
url = "2.5"

[dev-dependencies]
tempfile = "3"
