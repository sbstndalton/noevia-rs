[package]
name = "chat-turn"
version = "0.1.0"
description = "The native chat turn's pieces (noevia-core's chat.cjs in Rust, head start): the event wire shapes and their order, the tool-argument stream guard, the tool dispatch trait, the interrupted-turn partial and a single-round generation relay. Nothing calls it yet."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde_json = "1"
stream-guard = { path = "../stream-guard" }
js-json = { path = "../js-json" }
context-fit = { path = "../context-fit" }
provider-error = { path = "../provider-error" }
regex = "1"

[dev-dependencies]
