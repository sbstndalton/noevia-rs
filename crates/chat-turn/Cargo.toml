[package]
name = "chat-turn"
version = "0.1.0"
description = "The native chat turn (track R8): noevia-core's chat.cjs turn from the prepared hand-off to its saved end, with the per-call tool gate, replayed byte for byte on recorded Node turns. Nothing calls it yet."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde_json = "1"
js-json = { path = "../js-json" }
stream-guard = { path = "../stream-guard" }
context-fit = { path = "../context-fit" }
provider-error = { path = "../provider-error" }
regex = "1"
tool-exchange = { path = "../tool-exchange" }
prompt-framing = { path = "../prompt-framing" }

[dev-dependencies]
sha2 = "=0.10.9"
