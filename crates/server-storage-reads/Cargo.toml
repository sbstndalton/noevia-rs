[package]
name = "server-storage-reads"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
license = "MIT"
publish = false
description = "Private bounded connected-storage read engine (noevia#1368)"

# Private phase: no root workspace/lock or deployed server integration changes.
[workspace]

[dependencies]
dav-parse = { path = "../dav-parse" }
storage-path = { path = "../storage-path" }
s3-list-parse = { path = "../s3-list-parse" }
s3-sign = { path = "../s3-sign" }
js-json = { path = "../js-json" }
url = "=2.5.8"
base64 = "=0.22.1"
zeroize = { version = "=1.9.1", default-features = false, features = ["alloc"] }
rustix = { version = "=1.1.5", features = ["fs", "process", "param"] }
tokio = { version = "=1.53.2", default-features = false, features = ["io-util", "net", "time", "rt"] }
rustls = { version = "=0.23.45", default-features = false, features = ["std", "ring", "tls12"] }
webpki-roots = "=1.0.9"

[dev-dependencies]
serde_json = "=1.0.152"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
