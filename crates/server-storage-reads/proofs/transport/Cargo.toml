[package]
name = "storage-transport-dependency-proof"
version = "0.0.0"
edition = "2021"
rust-version = "1.99"
publish = false

[workspace]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

# Dependency-source proof only. No adapter or server activation is implemented.
[dependencies]
hyper = { version = "=1.11.1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["client-legacy", "http1", "tokio"] }
hyper-rustls = { version = "=0.27.10", default-features = false, features = ["http1", "tls12", "ring", "webpki-tokio"] }
rustls = { version = "=0.23.45", default-features = false, features = ["std", "ring", "tls12"] }
tokio = { version = "=1.53.2", default-features = false, features = ["io-util", "net", "time", "rt"] }
brotli-decompressor = { version = "=5.0.3", default-features = false, features = ["std"] }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
