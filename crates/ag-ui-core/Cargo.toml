[package]
name = "ag-ui-core"
version = "0.1.0"
description = "Core type library for the AG-UI protocol (vendored from ag-ui-protocol/ag-ui, MIT; see VENDORED.md), extended for Noevia."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
