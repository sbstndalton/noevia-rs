[package]
name = "server-store"
version = "0.1.0"
description = "Access to noevia-core's UI_DATA_DIR/cowork.db (schema owned by Node): read-only, plus writes limited to a compiled table-ownership list behind the NOEVIA_RUST_AUTH switch, and Node's atomic JSON write"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
rusqlite = { version = "0.40", features = ["bundled", "hooks"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
