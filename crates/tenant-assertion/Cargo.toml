[package]
name = "tenant-assertion"
version = "0.1.0"
description = "Diary's per-request tenant assertion check (X-Cowork-Tenant-Assertion v2), matching noevia-services' diary/agent/tenant_assertion.py"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
hmac = "=0.12.1"
sha2 = "=0.10.9"
subtle = { version = "=2.6.1", default-features = false }
zeroize = { version = "=1.9.1", default-features = false, features = ["alloc"] }

[dev-dependencies]
proptest = "1"
serde_json = "1"
