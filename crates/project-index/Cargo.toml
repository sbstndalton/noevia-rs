[package]
name = "project-index"
version = "0.1.0"
description = "The write side of core's project index (rag.cjs) in Rust: the chunker, the per-file version and generation state, vector slots, and indexing, tail appends and deletes of one file, checked against recorded Node outputs. Unused until wired behind a switch of its own (NOEVIA_RUST_RETRIEVAL already serves the read side)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
prompt-framing = { path = "../prompt-framing" }
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
embedding-worker = { path = "../embedding-worker" }
sqlite-vec-loader = { path = "../sqlite-vec-loader" }
tempfile = "3"
