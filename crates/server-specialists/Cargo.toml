[package]
name = "server-specialists"
version = "0.1.0"
description = "Coworkers and Spaces stores (sbstndalton/noevia#2446): an account's specialists, Spaces and Space pages, with their limits and the sha256 revision rule. No HTTP."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
js-json = { path = "../js-json" }
server-projects = { path = "../server-projects" }
server-store = { path = "../server-store" }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
