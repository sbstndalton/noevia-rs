[package]
name = "workspace-restore-verify"
version = "0.1.0"
description = "Diary workspace ZIP verification (preview/restore/import), matching noevia-services' diary/agent/workspace_restore.py _verify"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Pure-Rust raw DEFLATE (the crate forbids unsafe code), same as docx-text.
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }
serde_json = "1"
sha2 = "=0.10.9"

[dev-dependencies]
proptest = "1"
base64 = "0.22"
