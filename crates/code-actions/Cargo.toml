[package]
name = "code-actions"
version = "0.1.0"
description = "noevia-core's code-actions.cjs in Rust: a coding agent's tool call read into noevia's action classes (failing closed), the approval decision and the ACP permission option; the host applies its answer alone and asks a person wherever it is unsure"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The JS host side of core code-actions.cjs (`host`), for the Code harness session. Off by default,
# so the dav-parse WebAssembly module's dependency graph is unchanged.
host = ["dep:js-json"]

[dependencies]
js-json = { path = "../js-json", optional = true }
prompt-framing = { path = "../prompt-framing" }

[[test]]
name = "host"
required-features = ["host"]

[dev-dependencies]
proptest = "1"
