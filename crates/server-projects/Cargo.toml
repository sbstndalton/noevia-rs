[package]
name = "server-projects"
version = "0.1.0"
description = "Full-Rust migration M4: the project routes Rust owns (a project's images, its chat list and the free-chat list; permanent since noevia#1071), over projects.json and free-chats.json, which Rust alone writes"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
server-store = { path = "../server-store" }
js-json = { path = "../js-json" }
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
libc = "0.2"
rusqlite = { version = "0.40", features = ["bundled"] }
rustix = { version = "=1.1.5", features = ["fs"] }
serde_json = "1"
prompt-framing = { path = "../prompt-framing" }
upload-sniff = { path = "../upload-sniff" }
storage-path = { path = "../storage-path" }
url = "2.5"
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3"
proptest = "1"
