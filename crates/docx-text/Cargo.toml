[package]
name = "docx-text"
version = "0.1.0"
description = "Bounded DOCX container check + main-body text, matching noevia-services' ocr/docx_text.py"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Pure-Rust raw DEFLATE (the crate forbids unsafe code).
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }

[dev-dependencies]
proptest = "1"
serde_json = "1"
sha2 = "0.10"
