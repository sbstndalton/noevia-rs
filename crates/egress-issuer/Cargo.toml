[package]
name = "egress-issuer"
version = "0.1.0"
description = "Native issuer of the code-egress control key and signed task grants (port of noevia-core code-egress-control.cjs)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
egress = { path = "../egress" }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rustix = { version = "1.1.5", features = ["fs", "process"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "time", "sync"] }

[dev-dependencies]
hmac = "0.12"
rustix = { version = "1.1.5", features = ["process"] }
tempfile = "3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "time", "sync", "test-util"] }
