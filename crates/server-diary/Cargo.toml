[package]
name = "server-diary"
version = "0.1.0"
description = "noevia-core's Diary sidecar client (diary.cjs, diary-tenant-assertion.cjs, routes/diary.cjs, workspace-import.cjs, workspace-export.cjs) in Rust: the tenant headers, the signed assertion and the proxy-only Diary routes"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.22"
bytes = "1"
http-body = "1"
http-body-util = "0.1"
js-json = { path = "../js-json" }
policy-leaves = { path = "../policy-leaves" }
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
server-auth = { path = "../server-auth" }
server-storage-reads = { path = "../server-storage-reads" }
server-store = { path = "../server-store" }
sha2 = "0.10"
tenant-assertion = { path = "../tenant-assertion" }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
url = "2.5"
zeroize = { version = "1.9", default-features = false, features = ["alloc"] }

[dev-dependencies]
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = { version = "0.1", features = ["channel"] }
secret-envelope = { path = "../secret-envelope" }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
