# Every /api/ path the noevia web client (sbstndalton/noevia-web src/, tests excluded) names,
# and which server owns it. M0 of the full-Rust migration: everything is owner = "node" until a
# Rust slice takes the route over and tools/replay shows its contract corpus replays clean.
#
# Generated from noevia-web at the ref in web.ref by tools/contracts/routes_check.py --list;
# CI (routes-check job) fails when the client names a path that is missing here. Parameter
# names do not matter for the match ({id} == {chatId}); {*} is a computed segment, {*?} an
# optional suffix or query. A path kept for a non-web caller sets client = false.
#
# M1: bins/noevia-server (the Rust front) reads this file at build time. A route with
# owner = "rust" is answered natively, for the listed `methods` (all methods when absent); every
# other request is proxied to Node (bins/noevia-server/src/legacy_proxy.rs). Its tests fail when a
# rust route has no native handler or a node route does not reach the proxy. The non-/api entries
# at the end are the pages; `catch_all = true` is the build bundle + SPA fallback (core
# static-files.cjs, spa-routes.cjs) for every non-/api path no other entry names.
#
# M3: sign-in and the account (crates/server-account) are owner = "rust" with no switch: the old
# deployment switch NOEVIA_RUST_AUTH is retired (sbstndalton/noevia#1071) and Node no longer has
# those routes. `methods` lists what Rust answers; other methods stay Node's. The front read
# routes (usage, sampling/reasoning settings, routing mode/default, stats, ChatGPT status,
# storage metadata/list/read) are permanent the same way; their old switches are retired too. So
# are the M4 project routes (a project's images and chat list, the free-chat list) and the
# conversation export: their switch NOEVIA_RUST_PROJECTS is retired (sbstndalton/noevia#1071).
# Deployment ownership switches are retired (#1071); naming one fails the build.

