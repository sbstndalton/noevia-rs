# Every /api/ path the noevia web client (sbstndalton/noevia-web src/, tests excluded) names,
# and which server owns it. M0 of the full-Rust migration: everything is owner = "node" until a
# Rust slice takes the route over and tools/replay shows its contract corpus replays clean.
#
# Generated from noevia-web at the ref in web.ref by tools/contracts/routes_check.py --list;
# CI (routes-check job) fails when the client names a path that is missing here. Parameter
# names do not matter for the match ({id} == {chatId}); {*} is a computed segment, {*?} an
# optional suffix or query. A path kept for a non-web caller sets client = false.

