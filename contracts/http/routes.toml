[[route]]
# sbstndalton/noevia#2190 round 6 (rust-providers): the registry's list and create; the Rust front is
# the only writer of providers.json and shared-providers.json (provider_routes.rs).
path = "/api/providers"
owner = "rust"
methods = ["GET", "POST"]

[[route]]
# M6 (#1373): GET (crates/server-chatgpt-status, read-only). Round 6 (rust-providers): DELETE is the
# disconnect (the broker's tokens, the provider row and the projects' fallbacks, provider_routes.rs);
# the other methods stay Node's (its 404/405).
path = "/api/providers/chatgpt"
owner = "rust"
methods = ["GET", "DELETE"]

[[route]]
# sbstndalton/noevia#2190 round 5 (rust-chatgpt-oauth): the device sign-in, the token store and the
# catalogue are the Rust broker's (chatgpt_oauth_routes.rs). Node answered only these methods.
path = "/api/providers/chatgpt/device"
owner = "rust"
methods = ["POST"]

[[route]]
path = "/api/providers/chatgpt/device/cancel"
owner = "rust"
methods = ["POST"]

[[route]]
path = "/api/providers/chatgpt/device/poll"
owner = "rust"
methods = ["POST"]

[[route]]
path = "/api/providers/chatgpt/models"
owner = "rust"
methods = ["GET"]

[[route]]
# sbstndalton/noevia#2190 round 4 (rust-provider-test): the probe (POST). Round 6 (rust-providers):
# PUT and DELETE read `test` as a provider id, the registry's like any other.
path = "/api/providers/test"
owner = "rust"
methods = ["POST", "PUT", "DELETE"]

[[route]]
# sbstndalton/noevia#2190 round 6 (rust-providers): edit and remove one row.
path = "/api/providers/{id}"
owner = "rust"
methods = ["PUT", "DELETE"]

[[route]]
# sbstndalton/noevia#2190 round 5 (rust-provider-models): a stored provider's model list, every
# method (Node answered 405 for the others); a ChatGPT row's list is the token broker's.
path = "/api/providers/{providerId}/models{*?}"
owner = "rust"

[[route]]
path = "/api/ready"
owner = "rust"
methods = ["GET"]

[[route]]
# GET/provider capability and every non-PUT method remain explicitly Node-owned.
path = "/api/reasoning-settings"
owner = "rust"
methods = ["PUT"]

[[route]]
# M6 (#1305): GET only; PUT and every other method stay Node-owned (preferences and projects writes).
path = "/api/routing-default"
owner = "rust"
methods = ["GET"]

[[route]]
path = "/api/routing-mode"
owner = "rust"

[[route]]
path = "/api/routing-mode/allowed"
owner = "rust"

[[route]]
path = "/api/sampling-settings"
owner = "rust"

[[route]]
path = "/api/setup/complete"
owner = "rust"
methods = ["POST"]

[[route]]
path = "/api/setup/status"
owner = "rust"
methods = ["GET"]

[[route]]
# M6 (#1650): GET only (crates/server-stats); every other method stays Node's, which answers them
# all as it always did.
path = "/api/stats"
owner = "rust"
methods = ["GET"]

[[route]]
path = "/api/tool-approvals/{approvalId}"
owner = "node"

[[route]]
path = "/api/toolboxes"
owner = "node"

# sbstndalton/noevia#2202 round 2 (rust-toolboxes-permitted): computed by the front, every method
# (non-GET is its 405). GET /api/toolboxes stays Node's (prefill samples and live MCP state).
[[route]]
path = "/api/toolboxes/permitted"
owner = "rust"

[[route]]
path = "/api/usage"
owner = "rust"

[[route]]
path = "/api/usage/aggregate"
owner = "rust"

# sbstndalton/noevia#2191 close-out (rust-workspace): the GET, with the delete-old-chats sweep and the
# orphan chat-context cleanup it runs; core refuses it (rust-workspace.cjs).
[[route]]
path = "/api/workspace"
owner = "rust"
methods = ["GET"]

# Non-/api pages (M1). Node answers these before its static fallback, so they stay Node's.
# sbstndalton/noevia#2190: the public pages and the device approval page are the front's
# (bins/noevia-server public_pages.rs); Node refuses them (core rust-public-pages.cjs). The other
# methods of /about and /privacy stay Node's.
[[route]]
path = "/about"
owner = "rust"
methods = ["GET", "HEAD"]
client = false

[[route]]
path = "/privacy"
owner = "rust"
methods = ["GET", "HEAD"]
client = false

[[route]]
path = "/.well-known/webauthn"
owner = "rust"
methods = ["GET"]
client = false

# /device answers a JSON 404 while the nativeClientAuth feature is off (routes/device-auth.cjs).
[[route]]
path = "/device"
owner = "rust"
client = false

# The built web client: a file of the bundle (cache headers, ETag, br/gzip as static-files.cjs),
# else index.html for a client place (spa-routes.cjs), else a JSON 404.
[[route]]
path = "/{*}"
owner = "rust"
methods = ["GET", "HEAD"]
catch_all = true
client = false
